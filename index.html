  function pickTracks(opts) {
    opts = opts || {};
    return new Promise((resolve) => {
      const excluded = new Set(opts.excludeIds || []);
      const available = sortedTracks(state.tracks).filter((t) => !excluded.has(t.id));
      const selected = new Set();

      const rowHtml = (t) => `<label class="picker-item" data-id="${t.id}" data-hay="${esc(norm([t.title, t.artist, t.album].join(' ')))}">
          <input type="checkbox" value="${t.id}">
          ${artHtml(t, 'lib-art')}
          <span class="lib-text">
            <span class="lib-name">${esc(t.title)}</span>
            <span class="lib-sub">${esc(t.artist)}${t.album ? ' • ' + esc(t.album) : ''}</span>
          </span>
        </label>`;

      const back = openModal(`
        <h3>${esc(opts.title || 'Выберите треки')}</h3>
        <p class="sub">Отметьте треки, которые нужно добавить.</p>
        <div class="modal-search">${ICON('search')}<input type="search" placeholder="Поиск в библиотеке" data-search></div>
        <div class="modal-scroll" data-list>
          ${available.length ? available.map(rowHtml).join('') : '<div class="picker-empty">В библиотеке пока нет треков.</div>'}
        </div>
        <div class="modal-actions">
          <button class="btn-secondary" data-cancel>Отмена</button>
          <button class="btn-green" data-ok disabled>Добавить (<span data-count>0</span>)</button>
        </div>
      `);
      $('.modal', back).classList.add('wide');

      const list = $('[data-list]', back);
      const okBtn = $('[data-ok]', back);
      const counter = $('[data-count]', back);

      const refreshCount = () => {
        counter.textContent = String(selected.size);
        okBtn.disabled = selected.size === 0;
        okBtn.style.opacity = selected.size === 0 ? '.5' : '1';
      };

      list.addEventListener('change', (e) => {
        const cb = e.target.closest('input[type=checkbox]');
        if (!cb) return;
        if (cb.checked) selected.add(cb.value); else selected.delete(cb.value);
        refreshCount();
      });

      const search = $('[data-search]', back);
      if (search) {
        search.addEventListener('input', () => {
          const q = norm(search.value);
          $$('.picker-item', list).forEach((row) => {
            row.style.display = !q || row.dataset.hay.includes(q) ? '' : 'none';
          });
        });
        search.focus();
      }

      $('[data-cancel]', back).addEventListener('click', () => { closeModal(); resolve(null); });
      okBtn.addEventListener('click', () => { closeModal(); resolve(Array.from(selected)); });
      back.addEventListener('mousedown', (e) => { if (e.target === back) resolve(null); });
      refreshCount();
    });
  }

  function progressBar(text) {
    const bar = document.createElement('div');
    bar.className = 'upload-bar';
    bar.innerHTML = `<div class="spin"></div><div class="ub-text"><span class="ub-main">${esc(text)}</span><small class="ub-sub"></small></div>`;
    document.body.appendChild(bar);
    return {
      set(main, sub) {
        const m = $('.ub-main', bar); const s = $('.ub-sub', bar);
        if (m && main != null) m.textContent = main;
        if (s && sub != null) s.textContent = sub;
      },
      done() { bar.remove(); }
    };
  }

  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  function today() { return new Date().toISOString().slice(0, 10); }

  function sanitizeFileName(name, fallback) {
    const clean = String(name || '')
      .replace(/[\\/:*?"<>|\n\r\t]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 80);
    return clean || fallback || 'spotclone';
  }

  const EXT_RE = /\.([A-Za-z0-9]+)$/;
  function fileExt(fileName) {
    const m = String(fileName || '').match(EXT_RE);
    return m ? m[1].toLowerCase() : 'bin';
  }
  function coverExt(blob) {
    const type = (blob && blob.type) || 'image/jpeg';
    return /png/.test(type) ? 'png' : (/webp/.test(type) ? 'webp' : 'jpg');
  }

  /**
   * Собирает ZIP с произвольным набором треков (вся медиатека, плейлист, альбом, один трек).
   * Формат манифеста одинаковый, поэтому любой такой архив импортируется обратно.
   */
  async function buildArchive(opts) {
    const tracks = opts.tracks || [];
    const playlists = opts.playlists || [];
    const albums = opts.albums || [];
    const entries = [];
    const tracksMeta = [];
    const mediaPath = new Map();

    for (let i = 0; i < tracks.length; i++) {
      const t = tracks[i];
      const mediaName = `media/${t.id}.${fileExt(t.fileName)}`;
      mediaPath.set(t.id, mediaName);
      entries.push({ name: mediaName, blob: t.audioBlob });

      let coverName = null;
      if (t.coverBlob) {
        coverName = `covers/${t.id}.${coverExt(t.coverBlob)}`;
        entries.push({ name: coverName, blob: t.coverBlob });
      }

      let lyricsName = null;
      const lyricsText = t.lyrics ? (t.lyrics.synced || t.lyrics.plain || '') : '';
      if (lyricsText) {
        lyricsName = `lyrics/${t.id}.lrc`;
        entries.push({ name: lyricsName, blob: new Blob([lyricsText], { type: 'text/plain' }) });
      }

      tracksMeta.push({
        id: t.id, title: t.title, artist: t.artist, album: t.album, albumId: t.albumId || null,
        albumArtist: t.albumArtist || '', year: t.year || '', genre: t.genre || '',
        trackNo: t.trackNo || '', duration: t.duration || 0, size: t.size || 0,
        mime: t.mime || '', fileName: t.fileName, addedAt: t.addedAt,
        lyrics: t.lyrics || null,
        media: mediaName, cover: coverName, lyricsFile: lyricsName
      });

      if (opts.onProgress) opts.onProgress(i + 1, tracks.length, t);
      if (i % 10 === 0) await new Promise((r) => setTimeout(r, 0));
    }

    /* обложки альбомов */
    const albumsMeta = [];
    for (const a of albums) {
      let coverName = null;
      if (a.coverBlob) {
        coverName = `covers/album-${a.id}.${coverExt(a.coverBlob)}`;
        entries.push({ name: coverName, blob: a.coverBlob });
      }
      albumsMeta.push({
        id: a.id, name: a.name, artist: a.artist || '', year: a.year || '',
        trackIds: a.trackIds || tracks.map((t) => t.id), createdAt: a.createdAt || Date.now(),
        cover: coverName
      });
    }

    const playlistsMeta = playlists.map((pl) => ({
      id: pl.id, name: pl.name, trackIds: pl.trackIds || [], createdAt: pl.createdAt || Date.now(),
      system: !!pl.system
    }));

    /* m3u8 — чтобы архив открывался в обычных плеерах */
    const m3u = ['#EXTM3U', '#PLAYLIST:' + (opts.playlistName || 'SpotClone')];
    tracks.forEach((t) => {
      const path = mediaPath.get(t.id);
      if (!path) return;
      m3u.push(`#EXTINF:${Math.round((t.duration || 0) / 1000)},${t.artist} - ${t.title}`);
      m3u.push(path);
    });
    entries.push({ name: 'playlist.m3u8', blob: new Blob([m3u.join('\n') + '\n'], { type: 'audio/x-mpegurl' }) });

    const manifest = {
      app: 'SpotClone',
      version: 1,
      partial: !opts.full,
      title: opts.playlistName || 'SpotClone',
      exportedAt: new Date().toISOString(),
      tracks: tracksMeta,
      playlists: playlistsMeta,
      albums: albumsMeta,
      settings: opts.settings || null
    };

    entries.push({
      name: 'library.json',
      blob: new Blob([JSON.stringify(manifest, null, 2)], { type: 'application/json' })
    });
    entries.push({ name: 'readme.txt', blob: new Blob([BACKUP_README], { type: 'text/plain' }) });

    return { entries, manifest };
  }

  async function exportSet(opts) {
    if (!opts.tracks || !opts.tracks.length) { toast('Здесь нет треков для скачивания', 'err'); return; }
    const ui = progressBar(opts.label ? `Готовлю «${opts.label}»…` : 'Готовлю архив…');
    try {
      const { entries } = await buildArchive({
        ...opts,
        onProgress: (i, n, t) => ui.set(`Экспорт: ${i} из ${n}`, t.title)
      });
      ui.set('Упаковываю ZIP…', `файлов: ${entries.length}`);
      const blob = await Zip.create(entries, (i, n) => ui.set(`Упаковка: ${i} из ${n}`, ''));
      downloadBlob(blob, opts.fileName);
      ui.done();
      toast(`${opts.label || 'Архив'}: ${opts.tracks.length} ${plural(opts.tracks.length, 'трек', 'трека', 'треков')} · ${fmtBytes(blob.size)}`);
      return blob;
    } catch (e) {
      console.error(e);
      ui.done();
      toast('Не удалось создать архив: ' + e.message, 'err');
    }
  }

  async function exportLibrary() {
    if (!state.tracks.length) { toast('Медиатека пуста — нечего экспортировать', 'err'); return; }
    return exportSet({
      tracks: sortedTracks(state.tracks),
      playlists: state.playlists,
      albums: state.albums,
      full: true,
      settings: {
        volume: Player.state.volume,
        shuffle: Player.state.shuffle,
        repeat: Player.state.repeat,
        recent: state.recent
      },
      fileName: `spotclone-backup-${today()}.zip`,
      label: 'Медиатека',
      playlistName: 'SpotClone'
    });
  }

  /** Скачать то, что сейчас открыто: трек, плейлист, альбом, исполнителя, всю библиотеку. */
  async function exportContext(ctx) {
    if (!ctx) { toast('Нечего скачивать', 'err'); return; }
    const tracks = listForCtxId(ctx);
    if (!tracks || !tracks.length) { toast('Здесь нет треков для скачивания', 'err'); return; }

    const title = titleForCtxId(ctx) || 'SpotClone';
    let playlists = [];
    let albums = [];

    if (ctx === 'liked') {
      const lk = state.playlists.find((x) => x.id === LIKED_ID);
      if (lk) playlists = [lk];
    } else if (ctx.indexOf('playlist:') === 0) {
      const pl = playlistById(ctx.slice(9));
      if (pl) playlists = [pl];
    } else if (ctx.indexOf('release:') === 0) {
      const al = albumById(ctx.slice(8));
      if (al) albums = [al];
    } else if (ctx.indexOf('album:') === 0) {
      albums = [{
        id: 'tagged-' + sanitizeFileName(title, 'album').toLowerCase().replace(/\s+/g, '-'),
        name: title,
        artist: tracks[0].albumArtist || tracks[0].artist || '',
        year: tracks[0].year || '',
        trackIds: tracks.map((t) => t.id),
        createdAt: Date.now()
      }];
    }

    const single = ctx.indexOf('track:') === 0 && tracks.length === 1;
    const base = sanitizeFileName(single ? `${tracks[0].artist} - ${tracks[0].title}` : title, 'spotclone');

    return exportSet({
      tracks,
      playlists,
      albums,
      full: false,
      fileName: `spotclone-${base}-${today()}.zip`,
      label: title,
      playlistName: title
    });
  }

  function guessImageType(name) {
    if (/\.png$/i.test(name)) return 'image/png';
    if (/\.webp$/i.test(name)) return 'image/webp';
    if (/\.gif$/i.test(name)) return 'image/gif';
    return 'image/jpeg';
  }

  async function importLibrary(file, mode) {
    const ui = progressBar('Читаю архив…');
    try {
      const buffer = await readArrayBuffer(file);
      ui.set('Распаковываю…', file.name);
      const entries = await Zip.read(buffer);
      const byName = new Map(entries.map((e) => [e.name, e]));
      const findEntry = (name) => {
        if (!name) return null;
        if (byName.has(name)) return byName.get(name);
        const base = String(name).split('/').pop();
        return entries.find((e) => e.name.split('/').pop() === base) || null;
      };

      const manifestEntry = findEntry('library.json');
      if (!manifestEntry) throw new Error('в архиве нет library.json — это не бэкап SpotClone');
      const manifest = JSON.parse(Zip.utf8Decode(manifestEntry.data));

      if (mode === 'replace') {
        await DB.clearAll();
        Files.releaseAll();
        state.tracks = [];
        state.playlists = [];
        state.albums = [];
        state.recent = [];
        state.accentCache.clear();
        ensureLiked();
      }

      const idMap = new Map();
      let added = 0, skipped = 0, noFile = 0;
      const list = manifest.tracks || [];

      for (let i = 0; i < list.length; i++) {
        const meta = list[i];
        ui.set(`Импорт треков: ${i + 1} из ${list.length}`, meta.title || '');
        const media = findEntry(meta.media);
        if (!media) { noFile++; continue; }

        const dupe = state.tracks.find((t) => t.fileName === meta.fileName && t.size === (meta.size || media.data.length));
        if (dupe) { idMap.set(meta.id, dupe.id); skipped++; continue; }

        const cover = findEntry(meta.cover);
        const taken = state.tracks.some((t) => t.id === meta.id);
        const id = taken ? uid() : meta.id;

        let lyrics = meta.lyrics || null;
        if (!lyrics) {
          const lrcEntry = findEntry(meta.lyricsFile || `lyrics/${meta.id}.lrc`);
          if (lrcEntry) {
            const lrcText = Zip.utf8Decode(lrcEntry.data);
            lyrics = {
              synced: /\[\d{1,3}:\d{1,2}/.test(lrcText) ? lrcText : null,
              plain: lrcText,
              source: 'file',
              updatedAt: Date.now()
            };
          }
        }

        const track = {
          id,
          title: meta.title || 'Без названия',
          artist: meta.artist || 'Неизвестный исполнитель',
          album: meta.album || 'Сингл',
          albumId: null,
          albumArtist: meta.albumArtist || '',
          year: meta.year || '',
          genre: meta.genre || '',
          trackNo: meta.trackNo || '',
          duration: meta.duration || 0,
          size: meta.size || media.data.length,
          mime: meta.mime || Tags.guessMime(meta.fileName || '', ''),
          fileName: meta.fileName || (meta.media || '').split('/').pop(),
          addedAt: meta.addedAt || Date.now(),
          lyrics: lyrics,
          coverBlob: cover ? new Blob([cover.data], { type: guessImageType(cover.name) }) : null,
          audioBlob: new Blob([media.data], { type: meta.mime || 'audio/mpeg' })
        };
        await DB.putTrack(track);
        state.tracks.push(track);
        idMap.set(meta.id, id);
        added++;
        if (i % 5 === 0) await new Promise((r) => setTimeout(r, 0));
      }

      /* ---------- плейлисты ---------- */
      for (const pl of manifest.playlists || []) {
        const ids = (pl.trackIds || []).map((id) => idMap.get(id)).filter(Boolean);
        if (pl.id === LIKED_ID) {
          const likedPl = state.playlists.find((p) => p.id === LIKED_ID);
          if (likedPl) {
            ids.forEach((id) => { if (!likedPl.trackIds.includes(id)) likedPl.trackIds.unshift(id); });
            await DB.putPlaylist(likedPl);
          }
          continue;
        }
        if (!ids.length) continue;
        const exist = userPlaylists().find((p) => norm(p.name) === norm(pl.name));
        if (exist) {
          ids.forEach((id) => { if (!exist.trackIds.includes(id)) exist.trackIds.push(id); });
          await DB.putPlaylist(exist);
        } else {
          const newPl = {
            id: state.playlists.some((p) => p.id === pl.id) ? uid() : pl.id,
            name: pl.name || 'Импортированный плейлист',
            trackIds: ids,
            createdAt: pl.createdAt || Date.now()
          };
          state.playlists.push(newPl);
          await DB.putPlaylist(newPl);
        }
      }

      /* ---------- альбомы ---------- */
      for (const al of manifest.albums || []) {
        const ids = (al.trackIds || []).map((id) => idMap.get(id)).filter(Boolean);
        const exist = state.albums.find((a) => norm(a.name) === norm(al.name || ''));
        const cover = findEntry(al.cover);
        const coverBlob = cover ? new Blob([cover.data], { type: guessImageType(cover.name) }) : null;

        let target = exist;
        if (!target) {
          target = {
            id: state.albums.some((a) => a.id === al.id) ? uid() : al.id,
            name: al.name || 'Импортированный альбом',
            artist: al.artist || '',
            year: al.year || '',
            coverBlob,
            trackIds: ids,
            createdAt: al.createdAt || Date.now()
          };
          state.albums.push(target);
        } else {
          ids.forEach((id) => { if (!target.trackIds.includes(id)) target.trackIds.push(id); });
          if (coverBlob && !target.coverBlob) target.coverBlob = coverBlob;
        }
        await DB.putAlbum(target);

        for (const id of target.trackIds) {
          const t = trackById(id);
          if (t && !t.albumId) { t.albumId = target.id; await DB.putTrack(t); }
        }
      }

      /* ---------- настройки ---------- */
      if (mode === 'replace' && manifest.settings) {
        const st = manifest.settings;
        if (typeof st.volume === 'number') { Player.setVolume(st.volume, true); $('#volumeInput').value = String(Math.round(st.volume * 100)); }
        if (st.repeat) Player.setRepeat(st.repeat);
        if (typeof st.shuffle === 'boolean' && st.shuffle !== Player.state.shuffle) Player.toggleShuffle();
        if (Array.isArray(st.recent)) state.recent = st.recent.filter((id) => trackById(id));
      }

      ensureLiked();
      renderSidebar();
      updateStorageInfo();
      renderView();
      syncPlayerControls();
      ui.done();

      const parts = [`+${added} ${plural(added, 'трек', 'трека', 'треков')}`];
      if (skipped) parts.push(`${skipped} уже были`);
      if (noFile) parts.push(`${noFile} без файла`);
      toast('Импорт завершён: ' + parts.join(', '));
    } catch (e) {
      console.error(e);
      ui.done();
      toast('Импорт не удался: ' + e.message, 'err');
    }
  }

  function importDialog(file) {
    openModal(`
      <h3>Импорт медиатеки</h3>
      <p class="sub">Архив: ${esc(file.name)} · ${fmtBytes(file.size)}<br>
      «Объединить» добавит новые треки к текущим. «Заменить» сначала очистит библиотеку.</p>
      <div class="modal-actions" style="flex-wrap:wrap;gap:8px">
        <button class="btn-secondary" data-cancel>Отмена</button>
        <button class="btn-green ghost" data-merge>Объединить</button>
        <button class="btn-green" data-replace>Заменить</button>
      </div>
    `, (root) => {
      $('[data-cancel]', root).addEventListener('click', closeModal);
      $('[data-merge]', root).addEventListener('click', () => { closeModal(); importLibrary(file, 'merge'); });
      $('[data-replace]', root).addEventListener('click', () => {

  /* ============================================================
     ТЕКСТЫ ПЕСЕН (LRC): поиск в LRCLIB, просмотр, ручная синхронизация
     ============================================================ */
  const LYRICS_API = 'https://lrclib.net/api';
  const npView = { tab: 'art' };          // 'art' | 'lyrics'
  const lyricState = {
    loading: false,
    error: '',
    sync: null,                         // {trackId, lines:[{time,text}], index}
    tried: new Set()                    // для каких треков уже искали (чтобы не спамить API)
  };

  /* ---------- парсинг / сборка LRC ---------- */
  function parseLrc(text) {
    const lines = [];
    let offset = 0;

    String(text || '').split(/\r?\n/).forEach((raw) => {
      const off = raw.match(/^\s*\[offset:\s*([+-]?\d+)\]\s*$/i);
      if (off) { offset = parseInt(off[1], 10) || 0; return; }

      const stamps = [];
      let rest = raw;
      let m;
      const re = /^\s*\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/;
      while ((m = rest.match(re))) {
        const min = parseInt(m[1], 10);
        const sec = parseInt(m[2], 10);
        const frac = m[3] != null ? parseInt(m[3], 10) / Math.pow(10, m[3].length) : 0;
        stamps.push(Math.round((min * 60 + sec + frac) * 1000));
        rest = rest.slice(m[0].length);
      }

      const body = rest.replace(/^\s+/, '').replace(/\s+$/, '');

      if (!stamps.length) {
        if (!body) return;                              // пустая строка
        if (/^\[[a-zA-Z#]+:[^\]]*\]$/.test(body)) return; // [ar:], [ti:], [by:] и т.п.
        lines.push({ time: null, text: body });
        return;
      }
      stamps.forEach((t) => lines.push({ time: Math.max(0, t + offset), text: body }));
    });
    return lines;
  }

  function buildLrc(lines) {
    let prev = 0;
    return lines.map((l) => {
      const t = l.time == null ? prev : l.time;
      prev = t;
      const ms = Math.max(0, Math.round(t));
      const min = Math.floor(ms / 60000);
      const sec = Math.floor((ms % 60000) / 1000);
      const cs = Math.floor((ms % 1000) / 10);
      return `[${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${String(cs).padStart(2, '0')}] ${l.text}`;
    }).join('\n');
  }

  function plainFromLines(lines) {
    return lines.map((l) => l.text).join('\n');
  }

  function hasSyncedTimes(lines) {
    return lines.some((l) => l.time != null);
  }

  /* ---------- хранение ---------- */
  function getLyrics(track) {
    if (!track || !track.lyrics) return null;
    const ly = track.lyrics;
    const lines = parseLrc(ly.synced || ly.plain || '');
    if (!lines.length) return null;
    return { lines, synced: !!ly.synced && hasSyncedTimes(lines), source: ly.source || 'manual' };
  }

  async function saveLyrics(track, data) {
    track.lyrics = {
      synced: data.synced || null,
      plain: data.plain || (data.synced ? data.synced.replace(/\[[^\]]*\]/g, '').replace(/^\s+/gm, '') : ''),
      source: data.source || 'manual',
      updatedAt: Date.now()
    };
    await DB.putTrack(track);
    renderLyrics(true);
  }

  /* ---------- LRCLIB ---------- */
  function fetchWithTimeout(url, ms) {
    const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => { if (controller) controller.abort(); }, ms || 9000);
    return fetch(url, controller ? { signal: controller.signal } : undefined)
      .finally(() => clearTimeout(timer));
  }

  function pickLyricsRecord(list, track) {
    if (!Array.isArray(list) || !list.length) return null;
    const durSec = (track.duration || 0) / 1000;
    const scored = list.map((r) => {
      let score = 0;
      if (r.syncedLyrics) score += 60;
      if (r.plainLyrics) score += 10;
      if (durSec && r.duration) score -= Math.min(40, Math.abs(r.duration - durSec));
      return { r, score };
    }).sort((a, b) => b.score - a.score);
    return scored[0].r;
  }

  async function fetchLyricsOnline(track) {
    if (!track) return null;
    const clean = (s) => String(s || '').replace(/\s*[\(\[].*?[\)\]]\s*/g, ' ').trim();
    const artist = clean(track.artist);
    const title = clean(track.title);
    const duration = Math.round((track.duration || 0) / 1000);

    // 1) точное совпадение по артисту/названию/длительности
    try {
      const qs = new URLSearchParams({
        artist_name: track.artist || '',
        track_name: track.title || '',
        album_name: track.album && track.album !== 'Сингл' ? track.album : '',
        duration: String(duration)
      });
      const res = await fetchWithTimeout(`${LYRICS_API}/get?${qs}`, 9000);
      if (res.ok) {
        const data = await res.json();
        if (data && (data.syncedLyrics || data.plainLyrics)) return normalizeApiRecord(data);
      }
    } catch (e) { /* идём дальше */ }

    // 2) поиск по строке
    try {
      const res = await fetchWithTimeout(`${LYRICS_API}/search?q=${encodeURIComponent(artist + ' ' + title)}`, 9000);
      if (res.ok) {
        const list = await res.json();
        const best = pickLyricsRecord(list, track);
        if (best && (best.syncedLyrics || best.plainLyrics)) return normalizeApiRecord(best);
      }
    } catch (e) { /* идём дальше */ }

    return null;
  }

  function normalizeApiRecord(r) {
    return {
      synced: r.syncedLyrics || null,
      plain: r.plainLyrics || null,
      instrumental: !!r.instrumental,
      matched: [r.artistName, r.trackName].filter(Boolean).join(' — ')
    };
  }

  async function loadLyricsFor(track, force) {
    if (!track) return;
    const existing = getLyrics(track);
    if (existing && !force) { lyricState.error = ''; renderLyrics(true); return; }
    if (!force && lyricState.tried.has(track.id)) { renderLyrics(true); return; }
    lyricState.tried.add(track.id);

    lyricState.loading = true;
    lyricState.error = '';
    renderLyrics(true);

    let found = null;
    try {
      found = await fetchLyricsOnline(track);
    } catch (e) {
      lyricState.loading = false;
      lyricState.error = 'Не удалось обратиться к LRCLIB. Проверьте интернет или вставьте текст вручную.';
      renderLyrics(true);
      return;
    }
    lyricState.loading = false;

    if (!found) {
      lyricState.error = 'Текст не найден в LRCLIB. Можно вставить свой — и расставить тайминги.';
      renderLyrics(true);
      return;
    }
    if (found.instrumental) {
      lyricState.error = 'LRCLIB считает этот трек инструментальным.';
      renderLyrics(true);
      return;
    }
    await saveLyrics(track, {
      synced: found.synced,
      plain: found.plain,
      source: 'lrclib'
    });
  }

  /* ---------- отрисовка ---------- */
  const lyricsBody = () => $('#npLyricsBody');

  function scrollToY(el, y, behavior) {
    if (!el) return;
    if (typeof el.scrollTo === 'function') {
      try { el.scrollTo({ top: y, behavior: behavior || 'smooth' }); return; } catch (e) { /* fallback */ }
    }
    el.scrollTop = y;
  }

  function renderLyrics(force) {
    const panel = $('#npLyrics');
    if (!panel || panel.hidden) return;
    const body = lyricsBody();
    if (!body) return;
    const track = Player.current();
    const link = $('#npLinkLyrics');
    const btn = $('#btnLyrics');
    if (link) link.classList.toggle('on', npView.tab === 'lyrics');
    if (btn) btn.classList.toggle('on', npView.tab === 'lyrics');

    if (!track) {
      body.innerHTML = `<div class="lyr-empty">${ICON('lyrics')}<p>Включите трек — и здесь появится текст.</p></div>`;
      $('#npLyricsSource').textContent = 'Текст песни';
      return;
    }

    /* режим расстановки таймингов */
    if (lyricState.sync && lyricState.sync.trackId === track.id) {
      renderSyncMode(body);
      return;
    }

    if (lyricState.loading) {
      $('#npLyricsSource').textContent = 'Ищем текст…';
      body.innerHTML = `<div class="lyr-empty"><div class="lyr-spinner"></div><p>Ищу текст в LRCLIB…</p></div>`;
      return;
    }

    const ly = getLyrics(track);

    if (!ly) {
      $('#npLyricsSource').textContent = 'Текст песни';
      body.innerHTML = `<div class="lyr-empty">
          ${ICON('lyrics')}
          <p>${esc(lyricState.error || 'Текста пока нет. Найдём в интернете или вставим свой.')}</p>
          <div class="lyr-empty-actions">
            <button class="lyr-btn primary" data-action="lyrics-retry">${ICON('search')}Найти в интернете</button>
            <button class="lyr-btn" data-action="lyrics-edit">${ICON('edit')}Вставить текст</button>
          </div>
        </div>`;
      return;
    }

    const srcLabel = ly.source === 'lrclib' ? 'LRCLIB' : (ly.source === 'file' ? 'LRC-файл' : 'Свои тайминги');
    $('#npLyricsSource').textContent = (ly.synced ? 'Синхронизированный текст · ' : 'Текст · ') + srcLabel;

    if (!force && body.dataset.trackId === track.id && body.querySelector('.lyr-line')) {
      syncLyricsHighlight();
      return;
    }

    body.dataset.trackId = track.id;
    body.innerHTML = ly.lines.map((l, i) => `
      <div class="lyr-line ${l.time != null ? 'stamped' : ''}" data-line="${i}" data-time="${l.time == null ? '' : l.time}">
        ${esc(l.text || '♪')}
        ${l.time != null ? `<span class="lyr-time">${fmtTime(l.time)}</span>` : ''}
      </div>`).join('');

    syncLyricsHighlight(true);
  }

  let lastLyricIndex = -1;
  function currentLyricIndex(lines, ms) {
    let idx = -1;
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].time != null && lines[i].time <= ms) idx = i;
      else if (lines[i].time != null) break;
    }
    return idx;
  }

  function syncLyricsHighlight(forceScroll) {
    const panel = $('#npLyrics');
    if (!panel || panel.hidden || lyricState.sync) return;
    const track = Player.current();
    if (!track) return;
    const ly = getLyrics(track);
    if (!ly || !ly.synced) return;

    const ms = (Player.audio.currentTime || 0) * 1000;
    const idx = currentLyricIndex(ly.lines, ms);
    if (idx === lastLyricIndex && !forceScroll) return;
    lastLyricIndex = idx;

    const rows = $$('.lyr-line', lyricsBody());
    rows.forEach((row, i) => {
      row.classList.toggle('active', i === idx);
      row.classList.toggle('past', i < idx);
    });
    const active = rows[idx];
    if (active) {
      const body = lyricsBody();
      const top = active.offsetTop - body.clientHeight * 0.38;
      scrollToY(body, Math.max(0, top), forceScroll ? 'auto' : 'smooth');
    }
  }

  /* ---------- режим синхронизации ---------- */
  function startSync() {
    const track = Player.current();
    if (!track) return;
    const ly = getLyrics(track);
    const lines = ly ? ly.lines.map((l) => ({ time: l.time, text: l.text })) : [];
    if (!lines.length) {
      toast('Сначала вставьте текст песни', 'err');
      openLyricsEditor();
      return;
    }
    lyricState.sync = { trackId: track.id, lines, index: 0 };
    const firstEmpty = lines.findIndex((l) => l.time == null);
    lyricState.sync.index = firstEmpty >= 0 ? firstEmpty : 0;
    renderLyrics(true);
  }

  function renderSyncMode(body) {
    const s = lyricState.sync;
    $('#npLyricsSource').textContent = 'Расстановка таймингов';
    const now = (Player.audio.currentTime || 0) * 1000;

    body.innerHTML = `
      <div class="np-sync-hint">Слушайте трек и нажимайте «Отметить» на каждой строке · сейчас ${fmtTime(now)}</div>
      ${s.lines.map((l, i) => `
        <div class="lyr-line ${i === s.index ? 'sync-target' : ''} ${l.time != null ? 'stamped' : ''}"
             data-sync-line="${i}">
          ${esc(l.text || '♪')}
          <span class="lyr-time">${l.time != null ? fmtTime(l.time) : '—'}</span>
        </div>`).join('')}
      <div class="np-sync-bar">
        <button class="lyr-btn" data-action="lyrics-sync-undo">${ICON('prev')}Назад</button>
        <button class="lyr-btn primary" data-action="lyrics-sync-stamp">${ICON('timer')}Отметить строку</button>
        <button class="lyr-btn" data-action="lyrics-sync-done">${ICON('check')}Готово</button>
      </div>`;

    const target = body.querySelector('.sync-target');
    if (target) {
      const top = target.offsetTop - body.clientHeight * 0.3;
      scrollToY(body, Math.max(0, top), 'smooth');
    }
  }

  function renderSyncTime() {
    const hint = document.querySelector('#npLyricsBody .np-sync-hint');
    if (hint) hint.textContent = 'Слушайте трек и нажимайте «Отметить» на каждой строке · сейчас ' + fmtTime((Player.audio.currentTime || 0) * 1000);
  }

  function stampLine(lineIdx) {
    const s = lyricState.sync;
    if (!s) return;
    const idx = typeof lineIdx === 'number' ? lineIdx : s.index;
    if (idx < 0 || idx >= s.lines.length) return;
    s.lines[idx].time = Math.round((Player.audio.currentTime || 0) * 1000);
    s.index = Math.min(s.lines.length - 1, idx + 1);
    renderLyrics(true);
  }

  function undoSync() {
    const s = lyricState.sync;
    if (!s) return;
    const idx = Math.max(0, s.index - 1);
    s.lines[idx].time = null;
    s.index = idx;
    renderLyrics(true);
  }

  async function finishSync() {
    const s = lyricState.sync;
    if (!s) return;
    const track = trackById(s.trackId);
    lyricState.sync = null;
    if (!track) { renderLyrics(true); return; }
    const lrc = buildLrc(s.lines);
    await saveLyrics(track, { synced: lrc, plain: plainFromLines(s.lines), source: 'manual' });
    toast('Тайминги сохранены');
  }

  /* ---------- редактор текста ---------- */
  function openLyricsEditor() {
    const track = Player.current();
    if (!track) return;
    const ly = getLyrics(track);
    const text = ly ? plainFromLines(ly.lines) : '';

    const back = openModal(`
      <h3>Текст песни</h3>
      <p class="sub">${esc(track.title)} — ${esc(track.artist)}<br>
      Одна строка = одна строка текста. Тайминги можно расставить в плеере кнопкой «Отметить».</p>
      <label class="field"><span>Текст</span>
        <textarea data-text rows="10" placeholder="Вставьте текст песни…">${esc(text)}</textarea>
      </label>
      <div class="modal-actions" style="flex-wrap:wrap;gap:8px">
        <button class="btn-secondary" data-file>${ICON('archive')} Из .lrc</button>
        <button class="btn-secondary" data-cancel>Отмена</button>
        <button class="btn-green ghost" data-sync>${ICON('timer')} Синхронизировать</button>
        <button class="btn-green" data-save>Сохранить</button>
      </div>
    `, null);
    $('.modal', back).classList.add('wide');

    const ta = $('[data-text]', back);
    ta.focus();

    $('[data-cancel]', back).addEventListener('click', closeModal);

    $('[data-file]', back).addEventListener('click', () => {
      const input = $('#lrcInput');
      input.onchange = async () => {
        const file = input.files && input.files[0];
        input.value = '';
        if (!file) return;
        const text = await file.text();
        const lines = parseLrc(text);
        ta.value = plainFromLines(lines);
        closeModal();
        if (hasSyncedTimes(lines)) {
          await saveLyrics(track, { synced: buildLrc(lines), plain: plainFromLines(lines), source: 'file' });
          toast('LRC-файл загружен вместе с таймингами');
        } else {
          toast('Текст загружен, таймингов в файле нет');
        }
      };
      input.click();
    });

    $('[data-save]', back).addEventListener('click', async () => {
      const lines = ta.value.split(/\r?\n/).filter((l, i, arr) => l.trim() || i < arr.length - 1)
        .map((l) => ({ time: null, text: l.replace(/\s+$/, '') }));
      const kept = ly && ly.synced ? mergeTimes(lines, ly.lines) : lines;
      closeModal();
      if (!lines.length) { toast('Текст пустой', 'err'); return; }
      await saveLyrics(track, {
        synced: hasSyncedTimes(kept) ? buildLrc(kept) : null,
        plain: plainFromLines(lines),
        source: hasSyncedTimes(kept) ? (ly.source === 'lrclib' ? 'lrclib' : 'manual') : 'manual'
      });
      toast('Текст сохранён');
    });

    $('[data-sync]', back).addEventListener('click', async () => {
      const lines = ta.value.split(/\r?\n/).map((l) => ({ time: null, text: l.replace(/\s+$/, '') }))
        .filter((l) => l.text);
      closeModal();
      if (!lines.length) { toast('Сначала вставьте текст', 'err'); return; }
      const kept = ly && ly.synced ? mergeTimes(lines, ly.lines) : lines;
      await saveLyrics(track, {
        synced: hasSyncedTimes(kept) ? buildLrc(kept) : null,
        plain: plainFromLines(lines),
        source: 'manual'
      });
      if (!isNPOpen()) openNP();
      showLyricsTab(true);
      startSync();
    });
  }

  /** Сохраняет старые тайминги для строк с совпадающим текстом. */
  function mergeTimes(newLines, oldLines) {
    const map = new Map();
    oldLines.forEach((l) => { if (l.time != null) map.set(norm(l.text), l.time); });
    return newLines.map((l) => ({ time: map.has(norm(l.text)) ? map.get(norm(l.text)) : null, text: l.text }));
  }

  /* ---------- вкладки в полноэкранном плеере ---------- */
  function showLyricsTab(on) {
    npView.tab = on ? 'lyrics' : 'art';
    const panel = $('#npLyrics');
    const art = $('#npFullArt');
    if (!panel || !art) return;
    panel.hidden = !on;
    art.hidden = on;
    if (on) {
      renderLyrics(true);
      const track = Player.current();
      if (track && !getLyrics(track) && !lyricState.loading && !lyricState.sync) {
        loadLyricsFor(track, false);
      }
    }
    const link = $('#npLinkLyrics');
    if (link) link.classList.toggle('on', on);
    const btn = $('#btnLyrics');
    if (btn) btn.classList.toggle('on', on);
  }

  function toggleLyrics() {
    if (!Player.current()) { toast('Сначала включите трек', 'err'); return; }
    if (!isNPOpen()) {
      openNP();
      showLyricsTab(true);
      return;
    }
    showLyricsTab(npView.tab !== 'lyrics');
  }

  /* ---------- мобильный сайдбар ---------- */
  function toggleSidebar(force) {
    const sb = $('.sidebar');
    const open = typeof force === 'boolean' ? force : !sb.classList.contains('open');
    sb.classList.toggle('open', open);
    if (open && !$('#queueDrawer').hidden) toggleQueue(false);
    $('#scrim').hidden = !open && $('#queueDrawer').hidden;
  }
  function closeSidebarMobile() {
    if (window.innerWidth <= 860) toggleSidebar(false);
  }

  /* ---------- публичный API (для отладки и тестов) ---------- */
  window.SpotClone = {
    version: '1.1.0',
    state: state,
    Player: Player,
    DB: DB,
    Files: Files,
    Zip: Zip,
    Tags: Tags,
    exportLibrary: exportLibrary,
    exportContext: exportContext,
    buildArchive: buildArchive,
    importLibrary: importLibrary,
    editTrackModal: editTrackModal,
    createAlbum: createAlbum,
    addTracksToAlbum: addTracksToAlbum,
    pickTracks: pickTracks,
    lyrics: {
      parseLrc: parseLrc, buildLrc: buildLrc, getLyrics: getLyrics, saveLyrics: saveLyrics,
      fetchLyricsOnline: fetchLyricsOnline, loadLyricsFor: loadLyricsFor,
      startSync: startSync, stampLine: stampLine, finishSync: finishSync,
      toggleLyrics: toggleLyrics, showLyricsTab: showLyricsTab
    },
    openNP: openNP,
    closeNP: closeNP,
    go: go
  };

  /* ---------- старт ---------- */
  let started = false;
  function boot() {
    if (started) return;
    started = true;
    init();
  }
  document.addEventListener('DOMContentLoaded', boot);
  if (document.readyState !== 'loading') boot();
})();

</script>
</body>
</html>

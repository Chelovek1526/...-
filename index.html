    },

    setVolume: function (v, silent) {
      state.volume = Math.max(0, Math.min(1, v));
      audio.volume = state.muted ? 0 : state.volume;
      if (!silent) emit('volume');
    },

    toggleMute: function () {
      state.muted = !state.muted;
      audio.volume = state.muted ? 0 : state.volume;
      emit('volume');
    },

    toggleShuffle: function () {
      state.shuffle = !state.shuffle;
      var curTrack = current();
      if (state.shuffle) {
        var startIdx = curTrack ? state.queue.indexOf(curTrack) : -1;
        buildOrder(startIdx);
      } else {
        var keep = curTrack;
        buildOrder(-1);
        if (keep) { state.pos = state.queue.indexOf(keep); }
      }
      emit('shuffle');
      emit('queue');
    },

    cycleRepeat: function () {
      state.repeat = state.repeat === 'off' ? 'all' : (state.repeat === 'all' ? 'one' : 'off');
      emit('repeat');
    },

    setRepeat: function (mode) {
      state.repeat = mode;
      emit('repeat');
    },

    stop: function () {
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
      state.queue = []; state.order = []; state.pos = -1;
      state.playing = false; state.duration = 0;
      emit('queue'); emit('track'); emit('play');
    }
  };

  /* ---------- события audio ---------- */
  audio.addEventListener('play', function () { state.playing = true; emit('play'); });
  audio.addEventListener('pause', function () { state.playing = false; emit('play'); });
  audio.addEventListener('timeupdate', function () { emit('time'); });
  audio.addEventListener('durationchange', function () {
    if (isFinite(audio.duration) && audio.duration > 0) state.duration = audio.duration * 1000;
    emit('time');
  });
  audio.addEventListener('loadedmetadata', function () {
    if (isFinite(audio.duration) && audio.duration > 0) state.duration = audio.duration * 1000;
    emit('time');
  });
  audio.addEventListener('ended', function () { Player.next(false); });
  audio.addEventListener('error', function () {
    state.playing = false;
    emit('play');
    emit('error');
  });

  Player.setVolume(0.8, true);
  global.Player = Player;
})(window);

</script>
<script>
/* ===== js/app.js ===== */
/* ============================================================
   app.js — интерфейс SpotClone: библиотека, плейлисты, поиск,
   загрузка файлов, роутинг, горячие клавиши.
   ============================================================ */
(function () {
  'use strict';

  /* ============================ helpers ============================ */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function fmtTime(ms) {
    if (!ms || ms < 0 || !isFinite(ms)) return '0:00';
    const total = Math.round(ms / 1000);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
      : `${m}:${String(s).padStart(2, '0')}`;
  }
  function plural(n, one, few, many) {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }
  function fmtBytes(n) {
    if (!n) return '0 МБ';
    const mb = n / 1048576;
    return mb >= 1024 ? (mb / 1024).toFixed(1) + ' ГБ' : (mb < 1 ? (n / 1024).toFixed(0) + ' КБ' : mb.toFixed(1) + ' МБ');
  }
  const norm = (s) => String(s || '').toLowerCase().replace(/ё/g, 'е').trim();

  const ICON = (name, cls) => `<svg class="ico ${cls || ''}"><use href="#i-${name}"/></svg>`;

  /* ============================ state ============================ */
  const LIKED_ID = 'liked';

  const state = {
    tracks: [],
    playlists: [],
    albums: [],
    recent: [],
    filter: '',
    search: '',
    sortKey: 'addedAt',
    sortDir: 'desc',
    route: { name: 'home', id: null },
    currentList: [],
    uploading: false,
    accentCache: new Map()
  };

  const el = {};

  /* ============================ init ============================ */
  async function init() {
    el.content = $('#content');
    el.libraryList = $('#libraryList');
    el.libraryFilter = $('#libraryFilter');
    el.globalSearch = $('#globalSearch');
    el.storageInfo = $('#storageInfo');
    el.main = $('#main');

    bindEvents();

    try {
      await DB.init();
      await loadState();
    } catch (err) {
      showFatal(err);
      return;
    }

    if (DB.isMemory && DB.isMemory()) showMemoryNotice();

    Player.setVolume(state.volume, true);
    $('#volumeInput').value = String(Math.round(state.volume * 100));
    Player.setRepeat(state.repeat || 'off');
    if (state.shuffle) Player.toggleShuffle();
    syncPlayerControls();

    Player.on(onPlayerEvent);
    window.addEventListener('hashchange', route);
    route();
    updateStorageInfo();
  }

  function showMemoryNotice() {
    const bar = document.createElement('div');
    bar.className = 'memnotice';
    bar.innerHTML = 'Демо-режим: браузер не дал доступ к постоянному хранилищу (IndexedDB). Всё работает, но треки не сохранятся после перезагрузки. Откройте сайт по адресу <b>https://</b> или через локальный сервер — и библиотека станет постоянной.';
    el.main.insertBefore(bar, el.content);
    el.storageInfo.textContent = 'Хранилище недоступно — данные только в памяти';
  }

  function showFatal(err) {
    console.error(err);
    el.content.innerHTML = `
      <div class="view"><div class="empty" style="margin-top:60px">
        ${ICON('note')}
        <h3>Не удалось инициализировать хранилище</h3>
        <p>${esc(err.message || err)}</p>
        <p style="font-size:12.5px">Подсказка: откройте сайт по адресу <b>http://</b> или <b>https://</b> (GitHub Pages, локальный сервер), а не двойным щелчком по файлу.</p>
      </div></div>`;
  }

  async function loadState() {
    const [tracks, playlists, albums, meta] = await Promise.all([
      DB.getAllTracks(),
      DB.getAllPlaylists(),
      DB.getAllAlbums(),
      Promise.all([
        DB.getMeta('volume', 0.8),
        DB.getMeta('recent', []),
        DB.getMeta('repeat', 'off'),
        DB.getMeta('shuffle', false)
      ])
    ]);
    state.tracks = tracks || [];
    state.playlists = playlists || [];
    state.albums = albums || [];
    state.volume = typeof meta[0] === 'number' ? meta[0] : 0.8;
    state.recent = Array.isArray(meta[1]) ? meta[1] : [];
    state.repeat = meta[2] || 'off';
    state.shuffle = !!meta[3];
    ensureLiked();
  }

  function ensureLiked() {
    let liked = state.playlists.find((p) => p.id === LIKED_ID);
    if (!liked) {
      liked = { id: LIKED_ID, name: 'Мне нравится', trackIds: [], system: true, createdAt: Date.now() };
      state.playlists.unshift(liked);
      DB.putPlaylist(liked);
    }
    // чистим битые ссылки
    const valid = new Set(state.tracks.map((t) => t.id));
    state.playlists.forEach((pl) => {
      const before = pl.trackIds.length;
      pl.trackIds = pl.trackIds.filter((id) => valid.has(id));
      if (pl.trackIds.length !== before) DB.putPlaylist(pl);
    });
    (state.albums || []).forEach((al) => {
      const before = al.trackIds.length;
      al.trackIds = al.trackIds.filter((id) => valid.has(id));
      if (al.trackIds.length !== before) DB.putAlbum(al);
    });
    return liked;
  }

  const liked = () => state.playlists.find((p) => p.id === LIKED_ID) || { trackIds: [] };
  const userPlaylists = () => state.playlists.filter((p) => p.id !== LIKED_ID);
  const playlistById = (id) => state.playlists.find((p) => p.id === id);
  const isLiked = (id) => liked().trackIds.includes(id);
  const trackById = (id) => state.tracks.find((t) => t.id === id);
  const likedTracks = () => liked().trackIds.map(trackById).filter(Boolean);
  const playlistTracks = (pl) => (pl ? pl.trackIds.map(trackById).filter(Boolean) : []);

  /* ============================ sorting / filtering ============================ */
  function sortedTracks(list) {
    const k = state.sortKey, dir = state.sortDir === 'asc' ? 1 : -1;
    const arr = list.slice();
    arr.sort((a, b) => {
      let va, vb;
      switch (k) {
        case 'title': va = norm(a.title); vb = norm(b.title); break;
        case 'artist': va = norm(a.artist); vb = norm(b.artist); break;
        case 'album': va = norm(a.album); vb = norm(b.album); break;
        case 'duration': va = a.duration || 0; vb = b.duration || 0; break;
        default: va = a.addedAt || 0; vb = b.addedAt || 0;
      }
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      // стабильность: по имени
      return norm(a.title).localeCompare(norm(b.title));
    });
    return arr;
  }

  function filterTracks(list, query) {
    const q = norm(query);
    if (!q) return list;
    const words = q.split(/\s+/).filter(Boolean);
    return list.filter((t) => {
      const hay = norm([t.title, t.artist, t.album, t.albumArtist, t.genre, t.fileName].join(' '));
      return words.every((w) => hay.includes(w));
    });
  }

  /* ============================ accents (цвет из обложки) ============================ */
  function accentForCover(coverUrl) {
    if (!coverUrl) return Promise.resolve(null);
    if (state.accentCache.has(coverUrl)) return Promise.resolve(state.accentCache.get(coverUrl));
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        try {
          const c = document.createElement('canvas');
          c.width = 12; c.height = 12;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, 12, 12);
          const d = ctx.getImageData(0, 0, 12, 12).data;
          let r = 0, g = 0, b = 0, n = 0;
          for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
          r = Math.round(r / n); g = Math.round(g / n); b = Math.round(b / n);
          // чуть поднимаем яркость, чтобы градиент читался
          const boost = (v) => Math.round(clamp(v * 1.1 + 18, 0, 255));
          const rgb = [boost(r), boost(g), boost(b)];
          const val = rgb.join(',');
          state.accentCache.set(coverUrl, val);
          resolve(val);
        } catch (e) { resolve(null); }
      };
      img.onerror = () => resolve(null);
      img.src = coverUrl;
    });
  }

  function accentFor(track) {
    return track ? accentForCover(Files.coverUrl(track)) : Promise.resolve(null);
  }

  function applyAccent(rgb) {
    const view = $('.view', el.content);
    if (!view) return;
    if (!rgb) { view.style.background = ''; return; }
    view.style.background = `linear-gradient(180deg, rgba(${rgb},.55) 0px, rgba(${rgb},.18) 240px, rgba(18,18,18,0) 520px)`;
  }

  /* ============================ artwork html ============================ */
  function artHtml(track, cls) {
    const url = track ? Files.coverUrl(track) : null;
    if (url) return `<div class="${cls}"><img src="${url}" alt="" loading="lazy"></div>`;
    return `<div class="${cls}">${ICON('note')}</div>`;
  }
  function playlistArtHtml(pl, cls) {
    if (pl.id === LIKED_ID) return `<div class="${cls} liked">${ICON('heart-fill')}</div>`;
    const tracks = playlistTracks(pl);
    if (!tracks.length) return `<div class="${cls}">${ICON('note')}</div>`;
    return artHtml(tracks[0], cls);
  }

  /* ============================ sidebar ============================ */
  function renderSidebar() {
    const q = state.filter;
    const items = [];
    items.push({
      id: 'all', name: 'Все треки', sub: `${state.tracks.length} ${plural(state.tracks.length, 'трек', 'трека', 'треков')}`,
      route: '#/library', icon: 'note', active: state.route.name === 'library'
    });
    const lk = liked();
    items.push({
      id: LIKED_ID, name: 'Мне нравится', sub: `${lk.trackIds.length} ${plural(lk.trackIds.length, 'трек', 'трека', 'треков')}`,
      route: '#/liked', liked: true, active: state.route.name === 'liked'
    });
    userPlaylists().forEach((pl) => {
      items.push({
        id: pl.id, name: pl.name, sub: `${pl.trackIds.length} ${plural(pl.trackIds.length, 'трек', 'трека', 'треков')}`,
        route: '#/playlist/' + pl.id, playlist: pl, active: state.route.name === 'playlist' && state.route.id === pl.id
      });
    });
    state.albums.forEach((al) => {
      items.push({
        id: al.id, name: al.name,
        sub: `Альбом · ${al.trackIds.length} ${plural(al.trackIds.length, 'трек', 'трека', 'треков')}`,
        route: '#/release/' + al.id, album: al,
        active: state.route.name === 'release' && state.route.id === al.id
      });
    });

    const filtered = items.filter((it) => !q || norm(it.name).includes(norm(q)));

    let html = filtered.map((it) => {
      let art;
      if (it.liked) art = `<div class="lib-art liked">${ICON('heart-fill')}</div>`;
      else if (it.icon) art = `<div class="lib-art">${ICON(it.icon)}</div>`;
      else if (it.album) {
        const cu = albumCoverUrl(it.album);
        art = `<div class="lib-art">${cu ? `<img src="${cu}" alt="">` : ICON('disc')}</div>`;
      } else art = playlistArtHtml(it.playlist, 'lib-art');

      let menuBtn = '';
      let menuAttr = '';
      if (it.playlist) {
        menuAttr = `data-menu-playlist="${it.playlist.id}"`;
        menuBtn = `<button class="icon-btn" data-action="playlist-menu" data-id="${it.playlist.id}" title="Ещё">${ICON('more')}</button>`;
      } else if (it.album) {
        menuAttr = `data-menu-album="${it.album.id}"`;
        menuBtn = `<button class="icon-btn" data-action="album-menu" data-id="${it.album.id}" title="Ещё">${ICON('more')}</button>`;
      }
      return `<div class="lib-item ${it.active ? 'active' : ''}" data-route="${it.route}" ${menuAttr}>
        ${art}
        <div class="lib-text">
          <div class="lib-name">${esc(it.name)}</div>
          <div class="lib-sub">${esc(it.sub)}</div>
        </div>
        ${menuBtn}
      </div>`;
    }).join('');

    if (!filtered.length) {
      html = `<div class="lib-empty">Ничего не найдено. ${q ? 'Попробуйте другой запрос.' : 'Создайте плейлист или добавьте музыку.'}</div>`;
    }
    el.libraryList.innerHTML = html;
  }

  async function updateStorageInfo() {
    let used = 0;
    state.tracks.forEach((t) => { used += (t.size || 0); });
    let quotaTxt = '';
    try {
      if (navigator.storage && navigator.storage.estimate) {
        const est = await navigator.storage.estimate();
        if (est.quota) quotaTxt = ` · лимит ${fmtBytes(est.quota)}`;
      }
    } catch (e) { /* ignore */ }
    el.storageInfo.textContent = `Библиотека: ${state.tracks.length} ${plural(state.tracks.length, 'трек', 'трека', 'треков')} · ${fmtBytes(used)}${quotaTxt}`;
  }

  /* ============================ routing ============================ */
  function route() {
    const hash = location.hash || '#/home';
    const parts = hash.replace(/^#\/?/, '').split('/');
    const name = parts[0] || 'home';
    state.route = { name, id: parts[1] || null };

    $$('.nav-item').forEach((a) => {
      const target = a.getAttribute('href').replace(/^#\//, '');
      a.classList.toggle('active', target === name || (name === 'library' && target === 'library'));
    });

    if (name === 'search') {
      if (document.activeElement !== el.globalSearch) { /* keep typing */ }
    }

    renderSidebar();
    renderView();
    el.content.scrollTop = 0;
    closeSidebarMobile();
  }

  function go(hash) {
    if (location.hash === hash) route();
    else location.hash = hash;
  }

  /* ============================ views ============================ */
  function renderView() {
    const r = state.route;
    if (r.name === 'search') return renderSearchView();
    if (r.name === 'library') return renderLibraryView();
    if (r.name === 'liked') return renderLikedView();
    if (r.name === 'playlist') return renderPlaylistView(r.id);
    if (r.name === 'release' && r.id) return renderReleaseView(r.id);
    if (r.name === 'album' && r.id) return renderCollectionView('album', decodeURIComponent(r.id));
    if (r.name === 'artist' && r.id) return renderCollectionView('artist', decodeURIComponent(r.id));
    return renderHomeView();
  }

  /* ---------- карточки ---------- */
  function cardHtml(opts) {
    // opts: {route, title, sub, art, playCtx, menuAttr}
    return `<div class="card" data-route="${opts.route}" ${opts.menuAttr || ''}>
      <div class="card-art-wrap" style="position:relative">
        ${opts.art}
        <button class="card-play" data-action="play-ctx" data-ctx="${esc(opts.playCtx || '')}" title="Играть">${ICON('play')}</button>
      </div>
      <div class="card-name">${esc(opts.title)}</div>
      <div class="card-sub">${opts.sub}</div>
    </div>`;
  }

  function playlistCard(pl) {
    const count = pl.trackIds.length;
    return cardHtml({
      route: '#/playlist/' + pl.id,
      title: pl.name,
      sub: `${count} ${plural(count, 'трек', 'трека', 'треков')}`,
      art: playlistArtHtml(pl, 'card-art'),
      playCtx: 'playlist:' + pl.id,
      menuAttr: `data-menu-playlist="${pl.id}"`
    });
  }

  function trackCard(t) {
    return cardHtml({
      route: `#/album/${encodeURIComponent(t.album || '')}`,
      title: t.title,
      sub: `<a href="#/artist/${encodeURIComponent(t.artist || '')}">${esc(t.artist)}</a>`,
      art: artHtml(t, 'card-art'),
      playCtx: 'track:' + t.id
    });
  }

  /* ---------- home ---------- */
  function renderHomeView() {
    const tracks = sortedTracks(state.tracks);
    const recentTracks = state.recent.map(trackById).filter(Boolean).slice(0, 8);
    setActiveNav('home');

    let html = `<div class="view">`;

    if (!state.tracks.length) {
      html += emptyLibraryHtml();
      el.content.innerHTML = html + '</div>';
      return;
    }

    // быстрые плитки
    const tiles = [];
    tiles.push(`<button class="tile" data-route="#/liked"><span class="tile-art liked">${ICON('heart-fill')}</span><span class="tile-name">Мне нравится</span><span class="tile-play" data-action="play-ctx" data-ctx="liked">${ICON('play')}</span></button>`);
    tiles.push(`<button class="tile" data-route="#/library"><span class="tile-art">${ICON('note')}</span><span class="tile-name">Все треки</span><span class="tile-play" data-action="play-ctx" data-ctx="library">${ICON('play')}</span></button>`);
    userPlaylists().slice(0, 6).forEach((pl) => {
      const first = playlistTracks(pl)[0];
      const cover = first ? Files.coverUrl(first) : null;
      const art = cover
        ? `<span class="tile-art"><img src="${cover}" alt=""></span>`
        : `<span class="tile-art">${ICON('note')}</span>`;
      tiles.push(`<button class="tile" data-route="#/playlist/${pl.id}" data-menu-playlist="${pl.id}">${art}<span class="tile-name">${esc(pl.name)}</span><span class="tile-play" data-action="play-ctx" data-ctx="playlist:${pl.id}">${ICON('play')}</span></button>`);
    });

    html += `<div class="section" style="padding-top:18px"><div class="tiles">${tiles.join('')}</div></div>`;

    html += `<div class="section">
      <div class="section-head">
        <h2 class="section-title">Недавно прослушано</h2>
        <button class="link-btn" data-action="shuffle-all">Перемешать всё</button>
      </div>
      <div class="row-scroll">
        ${(recentTracks.length ? recentTracks : tracks.slice(0, 8)).map((t, i) => trackCard(t)).join('')}
      </div>
    </div>`;

    const pls = userPlaylists();
    html += `<div class="section">
      <div class="section-head"><h2 class="section-title">Твои плейлисты</h2>
      <button class="link-btn" data-action="new-playlist">Создать плейлист</button></div>
      <div class="row-scroll">
        <div class="card create-card" data-action="new-playlist">
          <div class="card-art create-art">${ICON('plus')}</div>
          <div class="card-name">Создать плейлист</div>
          <div class="card-sub">Соберите свои треки в подборки</div>
        </div>
        ${pls.map(playlistCard).join('')}
      </div>
    </div>`;

    const derived = derivedAlbums();
    if (state.albums.length || derived.length) {
      const albumItems = state.albums.map((al) => cardHtml({
        route: '#/release/' + al.id,
        title: al.name,
        sub: `${al.artist ? esc(al.artist) + ' · ' : ''}${al.trackIds.length} ${plural(al.trackIds.length, 'трек', 'трека', 'треков')}`,
        art: albumCoverUrl(al) ? `<div class="card-art"><img src="${albumCoverUrl(al)}" alt="" loading="lazy"></div>` : `<div class="card-art">${ICON('disc')}</div>`,
        playCtx: 'release:' + al.id,
        menuAttr: `data-menu-album="${al.id}"`
      }));
      const derivedItems = derived.slice(0, 8).map((d) => cardHtml({
        route: '#/album/' + encodeURIComponent(d.name),
        title: d.name,
        sub: `${esc(d.artist)} · ${d.tracks.length} ${plural(d.tracks.length, 'трек', 'трека', 'треков')}`,
        art: artHtml(d.tracks[0], 'card-art'),
        playCtx: 'album:' + encodeURIComponent(d.name)
      }));
      html += `<div class="section">
        <div class="section-head"><h2 class="section-title">Альбомы</h2>
        <button class="link-btn" data-action="new-album">Создать альбом</button></div>
        <div class="row-scroll">
          <div class="card create-card" data-action="new-album">
            <div class="card-art create-art">${ICON('plus')}</div>
            <div class="card-name">Новый альбом</div>
            <div class="card-sub">Обложка, название, треки</div>
          </div>
          ${albumItems.join('')}
          ${derivedItems.join('')}
        </div>
      </div>`;
    } else {
      html += `<div class="section">
        <div class="section-head"><h2 class="section-title">Альбомы</h2>

  function trackTable(tracks, opts) {
    opts = opts || {};
    const ctxTitle = opts.title || '';
    if (!tracks.length) {
      return `<div class="empty" style="margin:14px 8px">
        ${ICON('search')}
        <h3>Треков нет</h3>
        <p>Измените запрос или добавьте музыку в библиотеку.</p>
        <div class="empty-actions"><button class="btn-green" data-action="upload">${ICON('upload')}Загрузить файлы</button></div>
      </div>`;
    }
    const rows = tracks.map((t, i) => {
      const cur = Player.current();
      const isCur = cur && cur.id === t.id;
      const playingClass = isCur ? 'playing' : '';
      const likeOn = isLiked(t.id);
      return `<div class="tl-row ${playingClass}" data-track-id="${t.id}" data-pos="${i}">
        <div class="tl-num">
          <span class="num">${i + 1}</span>
          <div class="eq"><i></i><i></i><i></i><i></i></div>
          <button class="play-mini" data-action="row-play" data-pos="${i}" title="${isCur && Player.state.playing ? 'Пауза' : 'Играть'}">
            ${ICON(isCur && Player.state.playing ? 'pause' : 'play')}
          </button>
        </div>
        <div class="t-main">
          ${artHtml(t, 't-art')}
          <div class="t-text">
            <div class="t-name">${esc(t.title)}</div>
            <div class="t-artist"><a href="#/artist/${encodeURIComponent(t.artist)}" data-stop="1">${esc(t.artist)}</a></div>
          </div>
        </div>
        <div class="t-album"><a href="#/album/${encodeURIComponent(t.album)}" data-stop="1">${esc(t.album)}</a></div>
        <div class="t-date">${opts.hideDate ? (t.genre ? esc(t.genre) : fmtBytes(t.size)) : new Date(t.addedAt).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
        <div class="t-time">${fmtTime(t.duration)}</div>

        <div class="sortable" data-sort="title">Название${sortIndicator('title')}</div>

    });

  /* ---------- search ---------- */
  function renderSearchView() {
    setActiveNav('search');
    const q = state.search.trim();
    if (!q) {
      const genres = collectGenres();
      let html = `<div class="view">
        <div class="section"><div class="section-head"><h2 class="section-title">Обзор жанров</h2></div>
        <div class="section-head" style="margin-top:-6px"><span style="color:var(--text-mute);font-size:13px">Жанры берутся из тегов ваших файлов</span></div></div>
        <div class="genre-grid">`;
      if (genres.length) {
        const colors = ['#dc148c', '#1e3264', '#8d67ab', '#e8115b', '#148a08', '#e13300', '#503750', '#0d72ea', '#ba5d07', '#7774d3', '#b02897', '#af2896'];
        html += genres.map((g, i) => `<button class="genre" style="background:${colors[i % colors.length]}" data-action="genre" data-genre="${esc(g)}">${esc(g)}</button>`).join('');
      } else {
        html += `<div class="empty" style="grid-column:1/-1">
          ${ICON('search')}
          <h3>Жанров пока нет</h3>
          <p>Загрузите треки с тегами (ID3 / Vorbis / MP4) — и здесь появятся плитки жанров.</p>
          <div class="empty-actions"><button class="btn-green" data-action="upload">${ICON('upload')}Загрузить музыку</button></div>
        </div>`;
      }
      html += `</div></div>`;
      el.content.innerHTML = html;
      state.currentList = [];
      applyAccent(null);
      return;
    }

    const matched = sortedTracks(filterTracks(state.tracks, q));
    const albums = new Map();
    matched.forEach((t) => {
      const key = t.album || 'Сингл';
      if (!albums.has(key)) albums.set(key, []);
      albums.get(key).push(t);
    });
    const artists = new Map();
    matched.forEach((t) => {
      const key = t.artist || 'Неизвестный исполнитель';
      if (!artists.has(key)) artists.set(key, 0);
      artists.set(key, artists.get(key) + 1);
    });

    state.currentList = matched;
    state.currentContext = { key: 'search', title: 'Поиск: ' + q };

    let html = `<div class="view">
      <div class="section" style="padding-top:18px">
        <div class="section-head"><h2 class="section-title">Результаты по запросу «${esc(q)}»</h2>
        <span style="color:var(--text-mute);font-size:13px">${matched.length} ${plural(matched.length, 'трек', 'трека', 'треков')}</span></div>`;

    if (artists.size) {
      html += `<div class="section-head" style="margin:20px 0 10px"><h3 class="section-title small">Исполнители</h3></div>
      <div class="row-scroll">${Array.from(artists.entries()).slice(0, 8).map(([name, count]) => {
        const t = matched.find((x) => (x.artist || 'Неизвестный исполнитель') === name);
        return cardHtml({
          route: '#/artist/' + encodeURIComponent(name),
          title: name,
          sub: `Исполнитель • ${count} ${plural(count, 'трек', 'трека', 'треков')}`,
          art: artHtml(t, 'card-art').replace('card-art', 'card-art artist-art'),
          playCtx: 'artist:' + encodeURIComponent(name)
        });
      }).join('')}</div>`;
    }

    if (albums.size) {
      html += `<div class="section-head" style="margin:20px 0 10px"><h3 class="section-title small">Альбомы</h3></div>
      <div class="row-scroll">${Array.from(albums.entries()).slice(0, 10).map(([name, list]) => cardHtml({
        route: '#/album/' + encodeURIComponent(name),
        title: name,
        sub: `${esc(list[0].artist)} • ${list.length} ${plural(list.length, 'трек', 'трека', 'треков')}`,
        art: artHtml(list[0], 'card-art'),
        playCtx: 'album:' + encodeURIComponent(name)
      })).join('')}</div>`;
    }

    html += `<div class="section-head" style="margin:20px 0 10px"><h3 class="section-title small">Треки</h3></div>
      ${trackTable(matched.slice(0, 50), { title: 'Поиск: ' + q })}
      </div></div>`;
    el.content.innerHTML = html;
    applyAccent(null);
  }

  function collectGenres() {
    const set = new Map();
    state.tracks.forEach((t) => {
      const g = (t.genre || '').trim();
      if (!g) return;
      // ID3 иногда хранит "(17)Rock" или числа
      const clean = g.replace(/^\(\d+\)/, '').replace(/^\d+$/, '').trim();
      if (!clean || clean.length > 22) return;
      const key = clean.toLowerCase();
      set.set(key, set.get(key) || clean);
    });
    return Array.from(set.values()).slice(0, 12);
  }

  /* ============================ обновления точечно ============================ */
  function syncPlayingRows() {
    const cur = Player.current();
    const playing = Player.state.playing;
    $$('.tl-row', el.content).forEach((row) => {
      const isCur = cur && row.dataset.trackId === cur.id;
      row.classList.toggle('playing', !!isCur);
      const btn = $('.play-mini', row);
      if (btn) {
        btn.innerHTML = ICON(isCur && playing ? 'pause' : 'play');
        btn.title = isCur && playing ? 'Пауза' : 'Играть';
      }
    });
  }

  function syncPlayerControls() {
    const cur = Player.current();
    const playing = Player.state.playing;

    $('#btnPlay').innerHTML = ICON(playing ? 'pause' : 'play');
    $('#btnShuffle').classList.toggle('on', Player.state.shuffle);
    const rep = Player.state.repeat;
    $('#btnRepeat').innerHTML = ICON(rep === 'one' ? 'repeat-1' : 'repeat');
    $('#btnRepeat').classList.toggle('on', rep !== 'off');
    $('#btnMute').innerHTML = ICON(Player.state.muted || Player.state.volume === 0 ? 'mute' : 'volume');
    $('#btnMute').classList.toggle('muted', Player.state.muted);

    if (cur) {
      $('#npTitle').textContent = cur.title;
      $('#npArtist').textContent = cur.artist;
      const cover = Files.coverUrl(cur);
      $('#npCover').innerHTML = cover ? `<img src="${cover}" alt="">` : ICON('note');
      const btn = $('[data-action="like-current"]');
      btn.classList.toggle('liked', isLiked(cur.id));
      btn.innerHTML = ICON(isLiked(cur.id) ? 'heart-fill' : 'heart');
    } else {
      $('#npTitle').textContent = 'Ничего не играет';
      $('#npArtist').textContent = 'Загрузите музыку, чтобы начать';
      $('#npCover').innerHTML = ICON('note');
    }

    const dur = Player.audio.duration;
    if (isFinite(dur) && dur > 0) $('#durTime').textContent = fmtTime(dur * 1000);
    else $('#durTime').textContent = cur ? fmtTime(cur.duration) : '0:00';

    syncNP(false);
  }

  function syncProgress() {
    const audio = Player.audio;
    const dur = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 0;
    const cur = audio.currentTime || 0;
    const p = dur ? cur / dur : 0;
    $('#progressFill').style.width = (p * 100).toFixed(2) + '%';
    $('#progressKnob').style.left = (p * 100).toFixed(2) + '%';
    const input = $('#progressInput');
    if (document.activeElement !== input) input.value = String(Math.round(p * 1000));
    $('#curTime').textContent = fmtTime(cur * 1000);
    if (dur) $('#durTime').textContent = fmtTime(dur * 1000);
  }

  /* ---------- очередь ---------- */
  function renderQueue() {
    const drawer = $('#queueDrawer');
    if (drawer.hidden) return;
    const s = Player.state;
    $('#queueContext').textContent = s.context ? `Играет из: ${s.context}` : '';
    const cur = Player.current();
    const upcoming = s.order.slice(s.pos + 1).map((i) => s.queue[i]).filter(Boolean);
    const rows = [];
    if (cur) {
      rows.push(`<div class="q-item playing" data-play-id="${cur.id}">
        <div class="q-art">${Files.coverUrl(cur) ? `<img src="${Files.coverUrl(cur)}" alt="">` : ICON('note')}</div>
        <div class="q-text"><div class="q-name">${esc(cur.title)}</div><div class="q-artist">${esc(cur.artist)}</div></div>
        <span style="font-size:11px;color:var(--green)">сейчас</span>
      </div>`);
    }
    upcoming.forEach((t) => {
      rows.push(`<div class="q-item" data-play-id="${t.id}">
        <div class="q-art">${Files.coverUrl(t) ? `<img src="${Files.coverUrl(t)}" alt="">` : ICON('note')}</div>
        <div class="q-text"><div class="q-name">${esc(t.title)}</div><div class="q-artist">${esc(t.artist)}</div></div>

  }

  /* ============================ события плеера ============================ */
  function onPlayerEvent(type) {
    if (type === 'track') {
      lastLyricIndex = -1;
      lyricState.sync = null;
      lyricState.error = '';
      lyricState.loading = false;
      const bodyEl = $('#npLyricsBody');
      if (bodyEl) bodyEl.dataset.trackId = '';
      if (npView.tab === 'lyrics') {
        renderLyrics(true);
        const t = Player.current();
        if (t && !getLyrics(t)) loadLyricsFor(t, false);
      }
      syncPlayerControls();
      syncPlayingRows();
      renderQueue();
      updateMediaSession();
      addRecent(Player.current());
      syncNP(true);
    } else if (type === 'play') {
      syncPlayerControls();
      syncPlayingRows();
    } else if (type === 'time') {
      syncProgress();
      syncNPProgress();
      syncLyricsHighlight();
      if (lyricState.sync) renderSyncTime();
      if (Player.audio.duration && !isFinite(Player.state.duration)) syncPlayerControls();
    } else if (type === 'queue') {
      syncPlayingRows();
      renderQueue();
      syncPlayerControls();
    } else if (type === 'volume') {
      $('#volumeInput').value = String(Math.round(Player.state.volume * 100));
      $('#btnMute').innerHTML = ICON(Player.state.muted || Player.state.volume === 0 ? 'mute' : 'volume');
      $('#btnMute').classList.toggle('muted', Player.state.muted);
    } else if (type === 'shuffle' || type === 'repeat') {
      syncPlayerControls();
      DB.setMeta('shuffle', Player.state.shuffle);
      DB.setMeta('repeat', Player.state.repeat);
    } else if (type === 'error') {
      const cur = Player.current();
      toast(`Не удалось воспроизвести «${cur ? cur.title : 'трек'}». Формат может не поддерживаться браузером.`, 'err');
    }
  }

  function addRecent(track) {
    if (!track) return;
    state.recent = [track.id].concat(state.recent.filter((id) => id !== track.id)).slice(0, 20);
    DB.setMeta('recent', state.recent);
  }

  function updateMediaSession() {
    if (!('mediaSession' in navigator)) return;
    const t = Player.current();
    if (!t) { navigator.mediaSession.metadata = null; return; }
    const artwork = [];
    const cover = Files.coverUrl(t);
    if (cover) artwork.push({ src: cover, sizes: '512x512', type: t.coverBlob ? t.coverBlob.type : 'image/jpeg' });
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.title, artist: t.artist, album: t.album, artwork
      });
      navigator.mediaSession.setActionHandler('play', () => Player.toggle());
      navigator.mediaSession.setActionHandler('pause', () => Player.toggle());
      navigator.mediaSession.setActionHandler('previoustrack', () => Player.prev());
      navigator.mediaSession.setActionHandler('nexttrack', () => Player.next(true));
    } catch (e) { /* ignore */ }
  }

  /* ============================ загрузка файлов ============================ */
  function readArrayBuffer(file) {
    if (typeof file.arrayBuffer === 'function') return file.arrayBuffer();
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(fr.result);
      fr.onerror = () => reject(fr.error || new Error('Не удалось прочитать файл'));
      fr.readAsArrayBuffer(file);
    });
  }

  const AUDIO_EXT = /\.(mp3|mp2|m4a|m4b|m4r|mp4|alac|aac|flac|wav|wave|ogg|oga|opus|webm|aiff|aif|aifc|wma)$/i;
  const isAudioFile = (f) => f && (AUDIO_EXT.test(f.name) || (f.type && f.type.indexOf('audio/') === 0));

  async function handleFiles(fileList) {
    const files = Array.from(fileList || []).filter(isAudioFile);
    if (!files.length) { toast('Не найдено ни одного аудиофайла', 'err'); return; }
    if (state.uploading) { toast('Дождитесь завершения текущей загрузки'); return; }
    state.uploading = true;

    const bar = document.createElement('div');
    bar.className = 'upload-bar';
    bar.innerHTML = `<div class="spin"></div><div class="ub-text"><span id="ubMain">Обработка файлов…</span><small id="ubSub"></small></div>`;
    document.body.appendChild(bar);
    const ubMain = $('#ubMain', bar), ubSub = $('#ubSub', bar);

    let added = 0, skipped = 0, failed = 0;
    const newTracks = [];

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      ubMain.textContent = `Добавляю ${i + 1} из ${files.length}`;
      ubSub.textContent = `${file.name} · ${fmtBytes(file.size)}`;
      await new Promise((r) => setTimeout(r, 0)); // даём UI перерисоваться

      try {
        const dupe = state.tracks.some((t) => t.fileName === file.name && t.size === file.size);
        if (dupe) { skipped++; continue; }

        const buf = await readArrayBuffer(file);
        const meta = Tags.parse(buf, file.name, file.type);
        let duration = meta.duration || 0;
        if (!duration) duration = await probeDuration(file, meta.mime);

        const track = {
          id: uid(),
          title: meta.title,
          artist: meta.artist,
          album: meta.album,
          albumArtist: meta.albumArtist || '',
          year: meta.year || '',
          genre: meta.genre || '',
          trackNo: meta.trackNo || '',
          duration: Math.round(duration),
          size: file.size,
          mime: meta.mime,
          fileName: file.name,
          addedAt: Date.now() + i,
          coverBlob: meta.cover || null,
          audioBlob: file
        };
        await DB.putTrack(track);
        state.tracks.push(track);
        newTracks.push(track);
        added++;
      } catch (err) {
        console.error('Upload failed', file.name, err);
        failed++;
      }
    }

    bar.remove();
    state.uploading = false;

    if (added) {
      ensureLiked();
      renderSidebar();
      updateStorageInfo();
      renderView();
      const names = newTracks.slice(0, 3).map((t) => '«' + t.title + '»').join(', ');
      toast(`Добавлено: ${added} ${plural(added, 'трек', 'трека', 'треков')}${added <= 3 ? ' — ' + names : ''}`);
      if (added === 1 && !Player.current()) {
        // сразу запускаем, если библиотека была пуста
        Player.setQueue([newTracks[0]], 0, 'Библиотека');
      }
    }
    if (skipped) toast(`Пропущено дубликатов: ${skipped}`);
    if (failed) toast(`Не удалось обработать файлов: ${failed}`, 'err');
  }

  function probeDuration(file, mime) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(file);
      const a = new Audio();
      let done = false;
      const finish = (val) => {
        if (done) return;
        done = true;
        URL.revokeObjectURL(url);
        a.src = '';
        resolve(val);
      };
      const timer = setTimeout(() => finish(0), 8000);
      a.preload = 'metadata';
      a.onloadedmetadata = () => {
        clearTimeout(timer);
        const d = isFinite(a.duration) && a.duration > 0 ? a.duration * 1000 : 0;
        finish(d);
      };
      a.onerror = () => { clearTimeout(timer); finish(0); };
      a.src = url;
    });
  }

  /* ---------- демо-трек (синтез WAV прямо в браузере) ---------- */
  function buildDemoTrack() {
    const sr = 22050, secs = 16, n = sr * secs;
    const buf = new Float32Array(n);
    const scale = [0, 3, 5, 7, 10, 12, 15, 10, 7, 5, 3, 0];
    const base = 220; // A3
    const noteLen = sr * 0.25;
    for (let i = 0; i < n; i++) {
      const t = i / sr;
      const step = Math.floor(i / noteLen);
      const semi = scale[step % scale.length] + (Math.floor(step / scale.length) % 2 ? 12 : 0);
      const f = base * Math.pow(2, semi / 12);
      const local = (i % noteLen) / noteLen;
      const env = Math.pow(1 - local, 2.2);
      const lead = Math.sin(2 * Math.PI * f * t) * 0.32
        + Math.sin(2 * Math.PI * f * 2 * t) * 0.10
        + Math.sin(2 * Math.PI * f * 3 * t) * 0.04;
      const bassF = base / 2 * Math.pow(2, (Math.floor(step / 4) % 3 === 0 ? 0 : (Math.floor(step / 4) % 3 === 2 ? 5 : 7)) / 12);
      const bass = Math.sin(2 * Math.PI * bassF * t) * 0.18;
      const beat = (t % 0.5) < 0.06 ? Math.sin(2 * Math.PI * 90 * t) * Math.pow(1 - (t % 0.5) / 0.06, 2) * 0.22 : 0;
      const fade = Math.min(1, t / 0.6) * Math.min(1, (secs - t) / 1.2);
      buf[i] = (lead * env + bass * 0.7 + beat) * fade;
    }
    return { blob: encodeWavMono16(buf, sr), duration: secs * 1000 };
  }

  function encodeWavMono16(samples, sampleRate) {
    const buffer = new ArrayBuffer(44 + samples.length * 2);
    const view = new DataView(buffer);
    const w = (off, str) => { for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i)); };
    w(0, 'RIFF'); view.setUint32(4, 36 + samples.length * 2, true); w(8, 'WAVE');
    w(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    w(36, 'data'); view.setUint32(40, samples.length * 2, true);
    let off = 44;
    for (let i = 0; i < samples.length; i++) {
      const s = clamp(samples[i], -1, 1);
      view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      off += 2;
    }
    return new Blob([buffer], { type: 'audio/wav' });
  }

  /* ============================ плейлисты ============================ */
  async function createPlaylist(name, trackIds) {
    const pl = {
      id: uid(),
      name: name || 'Мой плейлист',
      trackIds: trackIds || [],
      createdAt: Date.now()
    };
    state.playlists.push(pl);
    await DB.putPlaylist(pl);
    renderSidebar();
    toast(`Плейлист «${pl.name}» создан`);
    go('#/playlist/' + pl.id);
    return pl;
  }

  async function deletePlaylist(pl) {
    if (pl.id === LIKED_ID) return;
    state.playlists = state.playlists.filter((p) => p.id !== pl.id);
    await DB.deletePlaylist(pl.id);
    renderSidebar();
    toast(`Плейлист «${pl.name}» удалён`);
    if (state.route.name === 'playlist' && state.route.id === pl.id) go('#/home');
  }

  async function toggleLike(trackId) {
    const pl = state.playlists.find((p) => p.id === LIKED_ID);
    const t = trackById(trackId);
    if (!pl || !t) return;
    const idx = pl.trackIds.indexOf(trackId);
    if (idx >= 0) {
      pl.trackIds.splice(idx, 1);
      toast(`«${t.title}» убрано из любимых`);
    } else {
      pl.trackIds.unshift(trackId);
      toast(`«${t.title}» добавлено в любимые`);
    }
    await DB.putPlaylist(pl);
    renderSidebar();
    syncPlayerControls();
    // обновляем видимые сердечки без перерисовки всей страницы
    $$('[data-action="toggle-like"]', el.content).forEach((btn) => {
      if (btn.dataset.id === trackId) {
        const on = isLiked(trackId);
        btn.classList.toggle('like-on', on);
        btn.innerHTML = ICON(on ? 'heart-fill' : 'heart');
        btn.title = on ? 'Убрать из любимых' : 'В любимые';
      }
    });
    if (state.route.name === 'liked') renderView();
  }

  async function addTracksToPlaylist(pl, trackIds) {
    let addedCount = 0;
    trackIds.forEach((id) => {
      if (pl.trackIds.indexOf(id) === -1) { pl.trackIds.push(id); addedCount++; }
    });
    await DB.putPlaylist(pl);
    renderSidebar();
    toast(addedCount
      ? `Добавлено в «${pl.name}»: ${addedCount}`
      : `Эти треки уже есть в «${pl.name}»`);
    if (state.route.name === 'playlist' && state.route.id === pl.id) renderView();
    if (state.route.name === 'liked' && pl.id === LIKED_ID) renderView();
    return addedCount;
  }

  async function deleteTrack(track) {
    const ok = await confirmModal(`Удалить «${track.title}»?`, 'Файл будет удалён из библиотеки этого браузера. Отменить это действие нельзя.');
    if (!ok) return;
    state.tracks = state.tracks.filter((t) => t.id !== track.id);
    await DB.deleteTrack(track.id);
    // чистим из плейлистов
    for (const pl of state.playlists) {
      const idx = pl.trackIds.indexOf(track.id);
      if (idx >= 0) { pl.trackIds.splice(idx, 1); await DB.putPlaylist(pl); }
    }
    Player.removeFromQueue(track);
    Files.release(track.id);
    renderSidebar();
    updateStorageInfo();
    if (Player.current() && Player.current().id === track.id) { /* уже обработано в removeFromQueue */ }
    renderView();
    toast('Трек удалён из библиотеки');
  }

  /* ============================ список для контекста ============================ */
  function listForCtxId(ctx) {
    if (!ctx) return state.currentList;
    if (ctx === 'library') return sortedTracks(state.tracks);
    if (ctx === 'liked') return likedTracks();
    if (ctx.indexOf('playlist:') === 0) return playlistTracks(playlistById(ctx.slice(9)));
    if (ctx.indexOf('release:') === 0) return albumTracks(albumById(ctx.slice(8)));
    if (ctx.indexOf('album:') === 0) {
      const v = decodeURIComponent(ctx.slice(6));
      return sortedTracks(state.tracks.filter((t) => norm(t.album) === norm(v)));
    }
    if (ctx.indexOf('artist:') === 0) {
      const v = decodeURIComponent(ctx.slice(7));
      return sortedTracks(state.tracks.filter((t) => norm(t.artist) === norm(v)));
    }
    if (ctx.indexOf('track:') === 0) return [trackById(ctx.slice(6))].filter(Boolean);
    return state.currentList;
  }
  function titleForCtxId(ctx) {
    if (ctx === 'library') return 'Все треки';
    if (ctx === 'liked') return 'Мне нравится';
    if (ctx.indexOf('playlist:') === 0) { const p = playlistById(ctx.slice(9)); return p ? p.name : 'Плейлист'; }
    if (ctx.indexOf('release:') === 0) { const a = albumById(ctx.slice(8)); return a ? a.name : 'Альбом'; }
    if (ctx.indexOf('album:') === 0) return decodeURIComponent(ctx.slice(6));
    if (ctx.indexOf('artist:') === 0) return decodeURIComponent(ctx.slice(7));
    return state.currentContext ? state.currentContext.title : '';
  }

  function playCtx(ctx, shuffleStart) {
    const list = listForCtxId(ctx);
    if (!list || !list.length) { toast('В этом списке нет треков', 'err'); return; }
    const wantShuffle = !!shuffleStart;
    if (Player.state.shuffle !== wantShuffle) Player.toggleShuffle();
    Player.setQueue(list, 0, titleForCtxId(ctx));
  }

  function togglePlayCtx(ctx) {
    const list = listForCtxId(ctx);
    if (!list || !list.length) { toast('В этом списке нет треков', 'err'); return; }
    const cur = Player.current();
    if (cur && list.some((t) => t.id === cur.id) && Player.state.context === titleForCtxId(ctx)) {
      Player.toggle();
      return;
    }
    playCtx(ctx, false);
  }

  /* ============================ UI: тосты, модалки, меню ============================ */
  let toastTimer = null;
  function toast(msg, kind) {
    const box = $('#toasts');
    const div = document.createElement('div');
    div.className = 'toast' + (kind === 'err' ? ' err' : '');
    div.innerHTML = `${ICON(kind === 'err' ? 'close' : 'check')}<span>${esc(msg)}</span>`;
    box.appendChild(div);
    setTimeout(() => {
      div.style.transition = 'opacity .2s, transform .2s';
      div.style.opacity = '0';
      div.style.transform = 'translateY(8px)';
      setTimeout(() => div.remove(), 220);
    }, 3200);
    while (box.children.length > 4) box.firstChild.remove();
  }

  function openModal(html, onMount) {
    closeModal();
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
    back.addEventListener('mousedown', (e) => { if (e.target === back) closeModal(); });
    $('#modalRoot').appendChild(back);
    if (onMount) onMount(back);
    const input = $('input[type=text]', back);
    if (input) { input.focus(); input.select(); }
    return back;
  }
  function closeModal() { $('#modalRoot').innerHTML = ''; }

  function confirmModal(title, text, okLabel) {
    return new Promise((resolve) => {
      const back = openModal(`
        <h3>${esc(title)}</h3>
        <p class="sub">${esc(text || '')}</p>
        <div class="modal-actions">
          <button class="btn-secondary" data-cancel>Отмена</button>
          <button class="btn-green" data-ok>${esc(okLabel || 'Удалить')}</button>
        </div>`, (root) => {
        $('[data-cancel]', root).addEventListener('click', () => { closeModal(); resolve(false); });
        $('[data-ok]', root).addEventListener('click', () => { closeModal(); resolve(true); });
      });
      back.addEventListener('mousedown', (e) => { if (e.target === back) resolve(false); });
    });
  }

  function promptPlaylistName(defaultName) {
    return new Promise((resolve) => {
      const back = openModal(`
        <h3>Создать плейлист</h3>
        <p class="sub">Название можно изменить позже.</p>
        <input type="text" placeholder="Мой плейлист" value="${esc(defaultName || '')}">
        <div class="modal-actions">
          <button class="btn-secondary" data-cancel>Отмена</button>
          <button class="btn-green" data-ok>Создать</button>
        </div>`, (root) => {
        const input = $('input[type=text]', root);
        const submit = () => { closeModal(); resolve(input.value.trim() || 'Мой плейлист'); };
        $('[data-ok]', root).addEventListener('click', submit);
        $('[data-cancel]', root).addEventListener('click', () => { closeModal(); resolve(null); });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); submit(); }
          if (e.key === 'Escape') { closeModal(); resolve(null); }
        });
      });
      back.addEventListener('mousedown', (e) => { if (e.target === back) resolve(null); });
    });
  }

  function choosePlaylist(trackIds) {
    const list = userPlaylists();
    const items = list.map((pl) => `<button class="pick-item" data-pick="${pl.id}">
      ${playlistArtHtml(pl, 'lib-art')}
      <span class="lib-text"><span class="lib-name">${esc(pl.name)}</span>
      <span class="lib-sub">${pl.trackIds.length} ${plural(pl.trackIds.length, 'трек', 'трека', 'треков')}</span></span>
    </button>`).join('');

    const back = openModal(`
      <h3>Добавить в плейлист</h3>
      <p class="sub">Выберите плейлист или создайте новый.</p>
      ${list.length ? `<div class="pick-list">${items}</div>` : `<p class="sub">У вас пока нет своих плейлистов.</p>`}
      <div class="modal-actions">
        <button class="btn-secondary" data-cancel>Отмена</button>
        <button class="btn-green" data-new>Новый плейлист</button>
      </div>`, (root) => {
      $('[data-cancel]', root).addEventListener('click', closeModal);
      $('[data-new]', root).addEventListener('click', async () => {
        closeModal();
        const name = await promptPlaylistName();
        if (!name) return;
        const pl = await createPlaylist(name, trackIds);
        toast(`Добавлено в «${pl.name}»: ${trackIds.length}`);
      });
      $$('[data-pick]', root).forEach((btn) => {
        btn.addEventListener('click', async () => {
          const pl = playlistById(btn.dataset.pick);
          closeModal();
          if (pl) await addTracksToPlaylist(pl, trackIds);
        });
      });
    });
    back.addEventListener('mousedown', (e) => { if (e.target === back) closeModal(); });
  }

  /* ---------- контекстное меню ---------- */
  function showMenu(x, y, items) {
    const menu = $('#contextMenu');
    menu.innerHTML = items.map((it, i) => {
      if (it.sep) return `<div class="menu-sep"></div>`;
      if (it.label) return `<div class="menu-label">${esc(it.label)}</div>`;
      return `<button class="menu-item ${it.danger ? 'danger' : ''}" data-mi="${i}">${it.icon ? ICON(it.icon) : ''}<span>${esc(it.text)}</span></button>`;
    }).join('');
    menu.hidden = false;
    // позиционирование
    const rect = menu.getBoundingClientRect();
    const px = Math.min(x, window.innerWidth - rect.width - 8);
    const py = Math.min(y, window.innerHeight - rect.height - 8);
    menu.style.left = Math.max(8, px) + 'px';
    menu.style.top = Math.max(8, py) + 'px';
    menu.onclick = (e) => {
      const btn = e.target.closest('[data-mi]');
      if (!btn) return;
      const it = items[Number(btn.dataset.mi)];
      hideMenu();
      if (it && it.action) it.action();
    };
  }
  function hideMenu() { const m = $('#contextMenu'); m.hidden = true; m.innerHTML = ''; }

      { text: 'Играть', icon: 'play', action: () => playCtx('track:' + track.id) },
      { text: 'Добавить в очередь', icon: 'queue', action: () => { Player.enqueue([track]); toast('Добавлено в очередь'); } },
      { sep: true },
      {
        text: isLiked(track.id) ? 'Убрать из «Мне нравится»' : 'Добавить в «Мне нравится»',
        icon: isLiked(track.id) ? 'heart-fill' : 'heart',
        action: () => toggleLike(track.id)
      },
      { text: 'Добавить в плейлист…', icon: 'plus', action: () => choosePlaylist([track.id]) },
      { text: 'Добавить в альбом…', icon: 'disc', action: () => chooseAlbum([track.id]) },
      { text: 'Изменить информацию…', icon: 'edit', action: () => editTrackModal(track) },

  /* ============================ drag & drop ============================ */
  let dragCounter = 0;
  function initDragDrop() {
    const dz = $('#dropzone');
    window.addEventListener('dragenter', (e) => {
      if (!e.dataTransfer || !Array.from(e.dataTransfer.types).includes('Files')) return;
      dragCounter++;
      dz.classList.add('show');
    });
    window.addEventListener('dragleave', () => {
      dragCounter = Math.max(0, dragCounter - 1);
      if (!dragCounter) dz.classList.remove('show');
    });
    window.addEventListener('dragover', (e) => { e.preventDefault(); });
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      dz.classList.remove('show');
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });
  }

  /* ============================ события ============================ */
  function bindEvents() {
    /* --- сайдбар --- */
    el.libraryFilter.addEventListener('input', (e) => {
      state.filter = e.target.value;
      renderSidebar();
    });

    el.libraryList.addEventListener('click', (e) => {
      const menuBtn = e.target.closest('[data-action="playlist-menu"]');
      if (menuBtn) {
        e.stopPropagation();
        const pl = playlistById(menuBtn.dataset.id);

      }
      const albumBtn = e.target.closest('[data-action="album-menu"]');
      if (albumBtn) {
        e.stopPropagation();
        const al = albumById(albumBtn.dataset.id);
        if (al) albumMenu(al, e);
        return;
      }
      const item = e.target.closest('[data-route]');
      if (item) go(item.dataset.route);
    });

    el.libraryList.addEventListener('contextmenu', (e) => {
      const item = e.target.closest('[data-menu-playlist]');
      if (item) {
        e.preventDefault();
        const pl = playlistById(item.dataset.menuPlaylist);
        if (pl) playlistMenu(pl, e);
        return;
      }
      const alItem = e.target.closest('[data-menu-album]');

        e.preventDefault();
        const al = albumById(alItem.dataset.menuAlbum);
        if (al) albumMenu(al, e);
      }
    });

    /* --- шапка --- */
    el.globalSearch.addEventListener('input', (e) => {

      $('.top-search-clear').hidden = !state.search;
      if (state.route.name !== 'search') go('#/search');
      else renderView();
    });
    el.globalSearch.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { el.globalSearch.value = ''; state.search = ''; $('.top-search-clear').hidden = true; renderView(); }
    });

    $('#fileInput').addEventListener('change', (e) => {
      handleFiles(e.target.files);
      e.target.value = '';
    });
    $('#folderInput').addEventListener('change', (e) => {
      handleFiles(e.target.files);
      e.target.value = '';
    });

    /* --- контент (делегирование) --- */
    el.content.addEventListener('click', onContentClick);
    el.content.addEventListener('contextmenu', (e) => {
      const row = e.target.closest('.tl-row');
      if (row) {
        e.preventDefault();
        const t = state.currentList[Number(row.dataset.pos)];
        if (t) {
          showMenu(e.clientX, e.clientY, [
            { text: 'Играть', icon: 'play', action: () => Player.playTrack(t, state.currentList, state.currentContext.title) },
            { text: isLiked(t.id) ? 'Убрать из «Мне нравится»' : 'В «Мне нравится»', icon: 'heart', action: () => toggleLike(t.id) },
            { text: 'Добавить в плейлист…', icon: 'plus', action: () => choosePlaylist([t.id]) },
            { text: 'Скачать трек (ZIP)', icon: 'download', action: () => exportContext('track:' + t.id) },
            { sep: true },
            { text: 'Удалить из библиотеки', icon: 'trash', danger: true, action: () => deleteTrack(t) }
          ]);
        }
        return;
      }
      const card = e.target.closest('[data-menu-playlist]');
      if (card) {
        e.preventDefault();
        const pl = playlistById(card.dataset.menuPlaylist);
        if (pl) playlistMenu(pl, e);
        return;
      }
      const albumCard = e.target.closest('[data-menu-album]');
      if (albumCard) {
        e.preventDefault();
        const al = albumById(albumCard.dataset.menuAlbum);
        if (al) albumMenu(al, e);
      }
    });

    /* --- глобальные действия (шапка, сайдбар, плеер) --- */
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#contextMenu')) hideMenu();
      if (el.content.contains(e.target)) return; // контент обрабатывается в onContentClick
      const actionEl = e.target.closest('[data-action]');
      if (actionEl) handleAction(actionEl, e);
    });

    /* --- плеер --- */
    $('#progressInput').addEventListener('input', (e) => {
      const p = Number(e.target.value) / 1000;
      $('#progressFill').style.width = (p * 100) + '%';
      $('#progressKnob').style.left = (p * 100) + '%';
      const audio = Player.audio;
      const dur = isFinite(audio.duration) ? audio.duration : 0;
      $('#curTime').textContent = fmtTime(p * dur * 1000);
    });
    $('#progressInput').addEventListener('change', (e) => {
      Player.seekPercent(Number(e.target.value) / 1000);
    });
    const pWrap = $('#progressWrap');
    pWrap.addEventListener('mousedown', () => pWrap.classList.add('dragging'));
    window.addEventListener('mouseup', () => pWrap.classList.remove('dragging'));

    $('#volumeInput').addEventListener('input', (e) => {
      Player.setVolume(Number(e.target.value) / 100);
      DB.setMeta('volume', Player.state.volume);
    });

    $('#queueList').addEventListener('click', (e) => {
      const row = e.target.closest('[data-play-id]');
      if (!row) return;
      const t = trackById(row.dataset.playId);
      if (!t) return;
      const qi = Player.state.queue.indexOf(t);
      if (qi >= 0) Player.jumpTo(qi);
    });

    $('#scrim').addEventListener('click', () => { toggleQueue(false); toggleSidebar(false); });

    /* --- полноэкранный плеер: перемотка --- */
    const npInput = $('#npProgressInput');
    if (npInput) {
      npInput.addEventListener('input', (e) => {
        const p = Number(e.target.value) / 1000;
        $('#npProgressFill').style.width = (p * 100) + '%';
        const dur = isFinite(Player.audio.duration) ? Player.audio.duration : 0;
        $('#npCurTime').textContent = fmtTime(p * dur * 1000);
      });
      npInput.addEventListener('change', (e) => Player.seekPercent(Number(e.target.value) / 1000));
    }

    /* --- клики по строкам текста --- */
    const lyricsPanel = $('#npLyrics');
    if (lyricsPanel) {
      lyricsPanel.addEventListener('click', (e) => {
        const syncRow = e.target.closest('[data-sync-line]');
        if (syncRow) { stampLine(Number(syncRow.dataset.syncLine)); return; }
        const row = e.target.closest('.lyr-line[data-time]');
        if (row && row.dataset.time) {
          Player.seek(Number(row.dataset.time) / 1000);
          lastLyricIndex = -1;
          syncLyricsHighlight(true);
        }
      });
      lyricsPanel.addEventListener('scroll', () => { lyricState.scrollPausedAt = Date.now(); }, { passive: true });

    /* --- импорт архива --- */
    $('#zipInput').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';

    });

    /* --- горячие клавиши --- */
    document.addEventListener('keydown', onKeyDown);

    /* --- навигация браузера --- */
    $('[data-action="history-back"]').addEventListener('click', () => history.back());
    $('[data-action="history-forward"]').addEventListener('click', () => history.forward());

    window.addEventListener('beforeunload', () => { Files.releaseAll(); });

    initDragDrop();
  }

  function onContentClick(e) {
    const sortEl = e.target.closest('[data-sort]');
    if (sortEl) {
      const key = sortEl.dataset.sort;
      if (key === 'index') { state.sortKey = 'addedAt'; state.sortDir = 'desc'; }
      else if (state.sortKey === key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      else { state.sortKey = key; state.sortDir = key === 'addedAt' ? 'desc' : 'asc'; }
      renderView();
      return;
    }

    const actionEl = e.target.closest('[data-action]');
    if (actionEl && !e.target.closest('[data-stop]')) {
      handleAction(actionEl, e);
      return;
    }

    if (e.target.closest('[data-route]') && !e.target.closest('.tl-row')) {
      const r = e.target.closest('[data-route]');
      if (!e.target.closest('[data-stop]')) { go(r.dataset.route); return; }
    }
    if (e.target.closest('[data-stop]')) return;

    const row = e.target.closest('.tl-row');
    if (row) {
      const pos = Number(row.dataset.pos);
      const t = state.currentList[pos];
      if (!t) return;
      const cur = Player.current();
      if (cur && cur.id === t.id) Player.toggle();
      else Player.setQueue(state.currentList, pos, state.currentContext ? state.currentContext.title : '');
    }
  }

  function handleAction(actionEl, e) {
    if (!actionEl) return;
    const action = actionEl.dataset.action;
    const ctx = actionEl.dataset.ctx;
    switch (action) {
      case 'upload': $('#fileInput').click(); break;
      case 'upload-folder': $('#folderInput').click(); break;
      case 'demo-track': addDemoTrack(); break;
      case 'new-playlist': promptPlaylistName().then((name) => { if (name) createPlaylist(name); }); break;
      case 'route-library': go('#/library'); break;
      case 'toggle-sidebar': toggleSidebar(); break;
      case 'open-np': openNP(); break;
      case 'close-np': closeNP(); break;
      case 'np-album': {
        const cur0 = Player.current();
        closeNP();
        if (!cur0) break;
        if (cur0.albumId && albumById(cur0.albumId)) go('#/release/' + cur0.albumId);
        else go('#/album/' + encodeURIComponent(cur0.album || 'Сингл'));
        break;
      }
      case 'np-edit': {
        const cur1 = Player.current();
        if (cur1) editTrackModal(cur1);
        break;
      }
      case 'np-menu': {
        const cur2 = Player.current();
        if (!cur2) break;
        showMenu(window.innerWidth - 260, 70, [
          { text: 'Изменить информацию…', icon: 'edit', action: () => editTrackModal(cur2) },
          { text: isLiked(cur2.id) ? 'Убрать из «Мне нравится»' : 'В «Мне нравится»', icon: 'heart', action: () => toggleLike(cur2.id) },
          { text: 'Добавить в плейлист…', icon: 'plus', action: () => choosePlaylist([cur2.id]) },
          { text: 'Добавить в альбом…', icon: 'disc', action: () => chooseAlbum([cur2.id]) },
          { text: 'Скачать трек (ZIP)', icon: 'download', action: () => exportContext('track:' + cur2.id) },
          { text: 'Свойства файла', icon: 'note', action: () => showTrackInfo(cur2) }
        ]);
        break;
      }
      case 'new-album': createAlbum(); break;
      case 'album-add-tracks': {
        const al0 = albumById(actionEl.dataset.id);
        if (!al0) break;
        pickTracks({ title: `Добавить в «${al0.name}»`, excludeIds: al0.trackIds }).then((ids) => {
          if (ids && ids.length) addTracksToAlbum(al0, ids);
        });
        break;
      }
      case 'edit-album': {
        const al1 = albumById(actionEl.dataset.id);
        if (al1) editAlbum(al1);
        break;
      }
      case 'album-menu': {
        e && e.stopPropagation();
        const al2 = albumById(actionEl.dataset.id);
        if (al2) albumMenu(al2, e);
        break;
      }
      case 'toggle-lyrics': toggleLyrics(); break;
      case 'np-lyrics': if (isNPOpen()) showLyricsTab(npView.tab !== 'lyrics'); else { openNP(); showLyricsTab(true); } break;
      case 'np-lyrics-off': showLyricsTab(false); break;
      case 'lyrics-retry': loadLyricsFor(Player.current(), true); break;
      case 'lyrics-refresh': loadLyricsFor(Player.current(), true); break;
      case 'lyrics-edit': openLyricsEditor(); break;
      case 'lyrics-sync': startSync(); break;
      case 'lyrics-sync-stamp': stampLine(); break;
      case 'lyrics-sync-undo': undoSync(); break;
      case 'lyrics-sync-done': finishSync(); break;
      case 'export-zip': exportLibrary(); break;
      case 'download-ctx': exportContext(actionEl.dataset.ctx || ctx); break;
      case 'import-zip': $('#zipInput').click(); break;
      case 'toggle': Player.toggle(); break;
      case 'next': Player.next(true); break;
      case 'prev': Player.prev(); break;
      case 'shuffle': Player.toggleShuffle(); break;
      case 'repeat': Player.cycleRepeat(); break;
      case 'mute': Player.toggleMute(); break;
      case 'toggle-queue': toggleQueue(); break;
      case 'like-current': {
        const cur = Player.current();
        if (cur) toggleLike(cur.id);
        break;
      }
      case 'play-ctx': {
        e && e.stopPropagation();
        playCtx(ctx);
        break;
      }
      case 'play-hero': togglePlayCtx(ctx); break;
      case 'hero-shuffle': playCtx(ctx, true); break;
      case 'shuffle-all': playCtx('library', true); break;
      case 'genre': {
        state.search = actionEl.dataset.genre;
        el.globalSearch.value = state.search;
        $('.top-search-clear').hidden = false;
        go('#/search');
        renderView();
        break;
      }
      case 'sort-cycle': {
        const keys = ['addedAt', 'title', 'album', 'artist', 'duration'];
        const i = keys.indexOf(state.sortKey);
        state.sortKey = keys[(i + 1) % keys.length];
        state.sortDir = state.sortKey === 'addedAt' ? 'desc' : 'asc';
        renderView();
        break;
      }
      case 'row-play': {
        e && e.stopPropagation();
        const pos = Number(actionEl.dataset.pos);
        const t = state.currentList[pos];
        if (!t) break;
        const cur = Player.current();
        if (cur && cur.id === t.id) Player.toggle();
        else Player.setQueue(state.currentList, pos, state.currentContext ? state.currentContext.title : '');
        break;
      }
      case 'toggle-like':
        e && e.stopPropagation();
        toggleLike(actionEl.dataset.id);
        break;
      case 'track-menu': {
        e && e.stopPropagation();
        const t = trackById(actionEl.dataset.id);
        if (t) trackMenu(t, null, e);
        break;
      }
      case 'hero-menu': {
        const pl = playlistById(actionEl.dataset.id);
        if (pl) { playlistMenu(pl, e); break; }
        const al3 = albumById(actionEl.dataset.id);
        if (al3) albumMenu(al3, e);
        break;
      }
      case 'playlist-menu': {
        const pl = playlistById(actionEl.dataset.id);
        if (pl) { e && e.stopPropagation(); playlistMenu(pl, e); }
        break;
      }
      case 'clear-search': {
        state.search = '';
        el.globalSearch.value = '';
        $('.top-search-clear').hidden = true;
        renderView();
        break;
      }
      default: break;
    }
  }

  function toggleQueue(force) {
    const drawer = $('#queueDrawer');
    const scrim = $('#scrim');
    const open = typeof force === 'boolean' ? force : drawer.hidden;
    drawer.hidden = !open;
    scrim.hidden = !open;
    if (open) renderQueue();
  }

  function bindViewSearch() {
    const input = $('#viewSearch');
    if (!input) return;
    input.addEventListener('input', (e) => {
      state.search = e.target.value;
      el.globalSearch.value = state.search;
      const list = filterTracks(sortedTracks(state.tracks), state.search);
      state.currentList = list;
      const tl = $('.tracklist', el.content);
      if (tl) {
        const wrapper = document.createElement('div');
        wrapper.innerHTML = trackTable(list, { title: 'Все треки' });
        tl.replaceWith(wrapper.firstElementChild);
      }
    });
  }

  function onKeyDown(e) {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    const typing = tag === 'INPUT' || tag === 'TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable);
    if (typing) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;

    if (e.key === 'Escape') {
      if (isNPOpen()) { closeNP(); return; }
      closeModal();
      hideMenu();
      return;
    }

    switch (e.key) {
      case ' ': e.preventDefault(); Player.toggle(); break;
      case 'ArrowRight': if (e.shiftKey) Player.next(true); else Player.seek(Player.audio.currentTime + 5); break;
      case 'ArrowLeft': if (e.shiftKey) Player.prev(); else Player.seek(Player.audio.currentTime - 5); break;
      case 'ArrowUp': e.preventDefault(); Player.setVolume(Player.state.volume + 0.05); DB.setMeta('volume', Player.state.volume); break;
      case 'ArrowDown': e.preventDefault(); Player.setVolume(Player.state.volume - 0.05); DB.setMeta('volume', Player.state.volume); break;
      case 'n': case 'N': case 'ю': case 'Ю': Player.next(true); break;
      case 'p': case 'P': case 'з': case 'З': Player.prev(); break;
      case 's': case 'S': case 'ы': case 'Ы': Player.toggleShuffle(); break;
      case 'r': case 'R': case 'к': case 'К': Player.cycleRepeat(); break;
      case 'm': case 'M': case 'ь': case 'Ь': Player.toggleMute(); break;
      case 'l': case 'L': case 'д': case 'Д': toggleLyrics(); break;
      case '/': e.preventDefault(); el.globalSearch.focus(); break;
      default: break;
    }
  }

  /* ============================================================
     ПОЛНОЭКРАННЫЙ ПЛЕЕР
     ============================================================ */
  function isNPOpen() { return $('#npFull').classList.contains('open'); }

  function openNP() {
    const np = $('#npFull');
    if (!np) return;
    requestAnimationFrame(() => {
      np.classList.add('open');
      np.setAttribute('aria-hidden', 'false');
    });
    document.body.classList.add('np-open');
    syncNP(true);
    showLyricsTab(npView.tab === 'lyrics');

  function syncNP(forceAccent) {

    const cur = Player.current();
    const playing = Player.state.playing;

    $('#npPlay').innerHTML = ICON(playing ? 'pause' : 'play');
    $('#npShuffle').classList.toggle('on', Player.state.shuffle);
    const rep = Player.state.repeat;
    $('#npRepeat').innerHTML = ICON(rep === 'one' ? 'repeat-1' : 'repeat');
    $('#npRepeat').classList.toggle('on', rep !== 'off');

    if (!cur) {
      $('#npFullTitle').textContent = 'Ничего не играет';
      $('#npFullArtist').textContent = '';
      $('#npFullArt').innerHTML = ICON('note');
      $('#npFullAlbum').textContent = 'Альбом';

      $('#npFullLike').classList.remove('liked');

    $('#npFullTitle').textContent = cur.title;
    $('#npFullArtist').textContent = cur.artist;

          return;
        }
        // только непрозрачные цвета: под плеером не должно быть видно интерфейс
        const parts = rgb.split(',').map(Number);
        const shade = (k) => `rgb(${parts.map((c) => Math.round(c * k)).join(',')})`;
        $('#npFullBg').style.background =
          `linear-gradient(180deg, ${shade(0.85)} 0%, ${shade(0.45)} 45%, #0b0b0b 80%, #000 100%)`;
      });
    }
    syncNPProgress();
  }

  function syncNPProgress() {
    const audio = Player.audio;
    const dur = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 0;
    const cur = audio.currentTime || 0;
    const p = dur ? cur / dur : 0;
    const fill = $('#npProgressFill');
    if (!fill) return;
    fill.style.width = (p * 100).toFixed(2) + '%';
    const input = $('#npProgressInput');
    if (document.activeElement !== input) input.value = String(Math.round(p * 1000));
    $('#npCurTime').textContent = fmtTime(cur * 1000);
    $('#npDurTime').textContent = dur ? fmtTime(dur * 1000)
      : (Player.current() ? fmtTime(Player.current().duration) : '0:00');
  }

  /* ============================================================

     ============================================================ */
  function readAsBlob(file, maxSize) {
    return new Promise((resolve) => {
      if (!file || !/^image\//.test(file.type || '')) { resolve(null); return; }
      let url = null;
      try { url = URL.createObjectURL(file); } catch (e) { resolve(file); return; }
      const img = new Image();
      const finish = (blob) => { if (url) URL.revokeObjectURL(url); resolve(blob); };
      img.onload = () => {
        try {
          const scale = Math.min(1, (maxSize || 640) / Math.max(img.width || 1, img.height || 1));
          const w = Math.max(1, Math.round((img.width || 600) * scale));
          const h = Math.max(1, Math.round((img.height || 600) * scale));
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          if (!ctx) { finish(file); return; }
          ctx.drawImage(img, 0, 0, w, h);
          c.toBlob((blob) => finish(blob || file), 'image/jpeg', 0.88);
        } catch (e) { finish(file); }
      };
      img.onerror = () => finish(file);
      img.src = url;
    });
  }

  /* ============================================================

  const albumById = (id) => state.albums.find((a) => a.id === id);
  const albumTracks = (al) => (al ? al.trackIds.map(trackById).filter(Boolean) : []);

  function derivedAlbums() {
    const map = new Map();
    state.tracks.forEach((t) => {
      if (t.albumId) return;                       // трек уже в своём альбоме
      const name = t.album || 'Сингл';
      const key = norm(name) + '|' + norm(t.albumArtist || t.artist);
      if (!map.has(key)) map.set(key, { key, name, artist: t.albumArtist || t.artist, tracks: [] });
      map.get(key).tracks.push(t);
    });
    return Array.from(map.values());
  }

  function albumCoverUrl(al) {
    if (al.coverBlob) return Files.coverUrlFromBlob(al.coverBlob, 'album-' + al.id);
    const first = albumTracks(al)[0];
    return first ? Files.coverUrl(first) : null;
  }

        </div>
      `);

      const preview = $('[data-preview]', back);
      const nameInput = $('[data-f="name"]', back);
      if (nameInput) nameInput.focus();

      $('[data-pick-cover]', back).addEventListener('click', () => {
        const input = $('#coverInput');
        input.onchange = async () => {
          const file = input.files && input.files[0];
          input.value = '';
          if (!file) return;
          const blob = await readAsBlob(file, 640);
          if (!blob) { toast('Не удалось прочитать изображение', 'err'); return; }
          coverBlob = blob;
          coverTouched = true;
          preview.innerHTML = `<img src="${URL.createObjectURL(blob)}" alt="">`;
        };
        input.click();
      });

      $('[data-clear-cover]', back).addEventListener('click', () => {
        coverBlob = null;
        coverTouched = true;
        preview.innerHTML = ICON('disc');
      });

      const done = (value) => {
        if (localUrl) URL.revokeObjectURL(localUrl);
        closeModal();
        resolve(value);
      };

      $('[data-cancel]', back).addEventListener('click', () => done(null));
      $('[data-save]', back).addEventListener('click', () => {
        const name = ($('[data-f="name"]', back).value || '').trim();
        if (!name) { toast('Укажите название альбома', 'err'); return; }

          name,

          year: ($('[data-f="year"]', back).value || '').trim(),

        });

  async function createAlbum() {
    const data = await albumFormModal(null);
    if (!data) return;
    const al = {
      id: uid(),
      name: data.name,
      artist: data.artist,
      year: data.year,
      coverBlob: data.coverBlob || null,
      trackIds: [],
      createdAt: Date.now()
    };
    state.albums.push(al);
    await DB.putAlbum(al);
    renderSidebar();
    toast(`Альбом «${al.name}» создан`);
    go('#/release/' + al.id);
    if (state.tracks.length) {
      const ids = await pickTracks({ title: `Добавить треки в «${al.name}»` });
      if (ids && ids.length) await addTracksToAlbum(al, ids);
    }
  }

  async function editAlbum(album) {
    const data = await albumFormModal(album);
    if (!data) return;
    album.name = data.name;
    album.artist = data.artist;
    album.year = data.year;
    if (data.coverTouched) album.coverBlob = data.coverBlob;
    await DB.putAlbum(album);

    if (data.applyToTracks) {
      for (const t of albumTracks(album)) {
        t.album = album.name;
        if (album.artist) t.albumArtist = album.artist;
        if (album.year) t.year = album.year;
        await DB.putTrack(t);
      }
    }
    Files.releaseCover('album-' + album.id);
    renderSidebar();
    renderView();
    syncPlayerControls();
    toast('Альбом обновлён');
  }

  async function addTracksToAlbum(album, ids) {
    let added = 0;
    ids.forEach((id) => {
      if (album.trackIds.indexOf(id) === -1) { album.trackIds.push(id); added++; }
    });
    await DB.putAlbum(album);
    for (const id of album.trackIds) {
      const t = trackById(id);
      if (!t) continue;
      t.albumId = album.id;
      t.album = album.name;
      if (album.artist) t.albumArtist = album.artist;
      if (album.year) t.year = album.year;
      if (album.coverBlob && !t.coverBlob) t.coverBlob = album.coverBlob;
      await DB.putTrack(t);
    }
    renderSidebar();
    renderView();
    if (added) toast(`Добавлено в «${album.name}»: ${added}`);
    return added;
  }

  async function removeTracksFromAlbum(album, ids) {
    album.trackIds = album.trackIds.filter((id) => ids.indexOf(id) === -1);
    await DB.putAlbum(album);
    for (const id of ids) {
      const t = trackById(id);
      if (t && t.albumId === album.id) { t.albumId = null; await DB.putTrack(t); }
    }
    renderSidebar();
    renderView();
    toast('Трек убран из альбома');
  }

  async function deleteAlbum(album) {
    const ok = await confirmModal(`Удалить альбом «${album.name}»?`, 'Треки останутся в библиотеке, у них лишь сбросится привязка к альбому.', 'Удалить');
    if (!ok) return;
    state.albums = state.albums.filter((a) => a.id !== album.id);
    await DB.deleteAlbum(album.id);
    for (const t of state.tracks) {
      if (t.albumId === album.id) { t.albumId = null; await DB.putTrack(t); }
    }
    Files.releaseCover('album-' + album.id);
    renderSidebar();
    toast('Альбом удалён');
    if (state.route.name === 'release' && state.route.id === album.id) go('#/home');
    else renderView();
  }

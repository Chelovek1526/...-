<!DOCTYPE html>
<!--
  ============================================================================
  SpotClone — клон Spotify, который живёт в браузере.
  Это СОБРАННЫЙ файл: CSS и JS встроены внутрь, внешних зависимостей нет.

  Правьте исходники в папке src/ и пересобирайте:  python3 build.py
  (или правьте прямо здесь — тогда src/ разойдётся с этой сборкой)
  ============================================================================
-->

<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpotClone — твоя музыка</title>
<meta name="description" content="SpotClone — локальный музыкальный плеер в стиле Spotify. Загружай свои MP3, M4A, FLAC, AAC и слушай прямо в браузере.">
<meta name="theme-color" content="#121212">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231db954'/%3E%3Cg fill='%23000'%3E%3Ccircle cx='12.5' cy='21' r='3.2'/%3E%3Ccircle cx='22.5' cy='19' r='3.2'/%3E%3Crect x='14.6' y='8' width='1.9' height='13'/%3E%3Crect x='24.6' y='6' width='1.9' height='13'/%3E%3Cpath d='M14.6 8l11.9-2v3.1l-11.9 2z'/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ============================================================
   SpotClone — тёмная тема в духе Spotify
   ============================================================ */
:root{
  --bg: #000000;
  --panel: #121212;
  --panel-2: #181818;
  --panel-3: #1f1f1f;
  --elev: #242424;
  --elev-hi: #2a2a2a;
  --text: #ffffff;
  --text-dim: #b3b3b3;
  --text-mute: #8a8a8a;
  --green: #1ed760;
  --green-hi: #3be477;
  --green-dark: #1db954;
  --border: rgba(255,255,255,.08);
  --radius: 8px;
  --player-h: 90px;
  --sidebar-w: 300px;
  --font: "Circular Std", "Segoe UI", Inter, -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  --shadow: 0 8px 24px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
input{font-family:inherit}
::selection{background:var(--green);color:#000}
svg.ico{width:20px;height:20px;fill:currentColor;flex:none;display:block}

/* ---------- scrollbars ---------- */
*::-webkit-scrollbar{width:12px;height:12px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border:3px solid transparent;background-clip:content-box;border-radius:8px}
*::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.4);background-clip:content-box}

/* ============================================================
   APP GRID
   ============================================================ */
.app{
  height:100vh; height:100dvh;
  display:grid;
  grid-template-columns: var(--sidebar-w) minmax(0,1fr);
  grid-template-rows: minmax(0,1fr) var(--player-h);
  gap:8px; padding:8px; background:var(--bg);
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar{
  display:flex; flex-direction:column; gap:8px; min-height:0;
  grid-column:1; grid-row:1;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 10px}
.brand-logo{width:30px;height:30px;flex:none}
.brand-name{font-weight:800;font-size:19px;letter-spacing:-.4px}
.nav{display:flex;flex-direction:column;gap:2px;background:var(--panel);border-radius:10px;padding:8px}
.nav-item{
  display:flex;align-items:center;gap:16px;padding:10px 12px;border-radius:6px;
  color:var(--text-dim);font-weight:700;transition:color .15s, background .15s;
}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav-item.active{color:#fff}

.library{
  flex:1; min-height:0; display:flex; flex-direction:column;
  background:var(--panel); border-radius:10px; overflow:hidden;
}
.library-head{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 6px 14px}
.library-title{display:flex;align-items:center;gap:14px;color:var(--text-dim);font-weight:700;padding:6px;border-radius:6px}
.library-title:hover{color:#fff}
.library-tools{display:flex;gap:2px}
.library-filter{
  position:relative;margin:2px 12px 8px;display:flex;align-items:center;gap:8px;
  background:var(--panel-3);border-radius:6px;padding:0 10px;color:var(--text-mute);
}
.library-filter .ico{width:16px;height:16px}
.library-filter input{
  flex:1;min-width:0;background:none;border:0;outline:none;color:#fff;font-size:13px;padding:8px 0;
}
.library-list{flex:1;overflow-y:auto;padding:0 8px 8px}
.lib-item{
  display:flex;align-items:center;gap:10px;padding:6px;border-radius:6px;cursor:pointer;
  transition:background .12s;
}
.lib-item:hover{background:rgba(255,255,255,.07)}
.lib-item.active{background:rgba(255,255,255,.11)}
.lib-art{
  width:46px;height:46px;border-radius:5px;flex:none;overflow:hidden;position:relative;
  background:linear-gradient(135deg,#333,#1a1a1a);display:grid;place-items:center;color:#9a9a9a;
}
.lib-art img{width:100%;height:100%;object-fit:cover;display:block}
.lib-art.liked{background:linear-gradient(135deg,#450af5,#c4efd9);color:#fff}
.lib-art.liked .ico{filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.lib-text{min-width:0;flex:1}
.lib-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-sub{font-size:12px;color:var(--text-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-empty{color:var(--text-mute);font-size:13px;padding:14px;line-height:1.6}
.library-foot{border-top:1px solid var(--border);padding:8px}
.foot-btn{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:6px;
  color:var(--text-dim);font-weight:600;font-size:13px;
}
.foot-btn:hover{color:#fff;background:rgba(255,255,255,.06)}
.storage{font-size:11px;color:#6f6f6f;padding:4px 10px 2px}

/* ============================================================
   MAIN
   ============================================================ */
.main{
  grid-column:2;grid-row:1;min-width:0;min-height:0;
  display:flex;flex-direction:column;border-radius:10px;overflow:hidden;
  background:var(--panel);position:relative;
}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 20px;flex:none;z-index:5;position:relative;
  background:rgba(18,18,18,.6);backdrop-filter:blur(12px);
}
.topbar-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.topbar-right{display:flex;align-items:center;gap:10px;flex:none}
.round-btn{
  width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;
  color:var(--text-dim);transition:color .15s,background .15s;
}
.round-btn:hover{color:#fff;background:rgba(0,0,0,.8)}
.round-btn .ico{width:18px;height:18px}
.top-search{
  display:flex;align-items:center;gap:8px;margin-left:8px;flex:1;max-width:420px;
  background:var(--panel-3);border:1px solid transparent;border-radius:24px;padding:0 12px;color:var(--text-mute);
  transition:border-color .15s,background .15s;
}
.top-search:focus-within{border-color:rgba(255,255,255,.35);background:var(--elev)}
.top-search input{flex:1;min-width:0;background:none;border:0;outline:none;color:#fff;font-size:13.5px;padding:9px 0}
.top-search-clear{color:var(--text-mute);display:grid;place-items:center}
.top-search-clear:hover{color:#fff}
.btn-green{
  display:inline-flex;align-items:center;gap:7px;background:var(--green);color:#000;
  font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:24px;
  transition:transform .12s,background .15s;
}
.btn-green:hover{background:var(--green-hi);transform:scale(1.03)}
.btn-green .ico{width:17px;height:17px}
.btn-green.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn-green.ghost:hover{background:rgba(255,255,255,.1);border-color:#fff}
.user-chip{
  display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.5);border-radius:24px;padding:3px 12px 3px 3px;
  font-size:13px;font-weight:600;
}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--green);color:#000;display:grid;place-items:center;font-size:11px;font-weight:800}

.content{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scroll-behavior:smooth}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view{animation:fadeUp .25s ease both;padding-bottom:36px}

/* ---------- hero / view header ---------- */
.hero{
  display:flex;align-items:flex-end;gap:22px;padding:16px 24px 24px;
  background:linear-gradient(180deg, rgba(255,255,255,.10), transparent);
}
.hero-art{
  width:192px;height:192px;border-radius:6px;flex:none;overflow:hidden;box-shadow:var(--shadow);
  background:linear-gradient(135deg,#4a4a4a,#1c1c1c);display:grid;place-items:center;color:#cfcfcf;
}
.hero-art img{width:100%;height:100%;object-fit:cover}
.hero-art .ico{width:64px;height:64px;opacity:.55}
.hero-art.liked{background:linear-gradient(135deg,#450af5,#c4efd9);color:#fff}
.hero-info{min-width:0}
.hero-kicker{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#e8e8e8}
.hero-title{
  font-size:clamp(30px,5vw,72px);font-weight:900;letter-spacing:-2px;line-height:1.05;margin:6px 0 12px;
  word-break:break-word;
}
.hero-title[contenteditable="true"]{outline:2px solid rgba(255,255,255,.5);border-radius:6px;padding:0 6px;margin-left:-6px}
.hero-sub{color:var(--text-dim);font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hero-sub b{color:#fff}
.dot{color:#6a6a6a}
.hero-actions{display:flex;align-items:center;gap:20px;padding:18px 24px 8px}
.play-fab{
  width:56px;height:56px;border-radius:50%;background:var(--green);color:#000;display:grid;place-items:center;
  box-shadow:0 8px 20px rgba(0,0,0,.4);transition:transform .12s,background .15s;
}
.play-fab:hover{transform:scale(1.06);background:var(--green-hi)}
.play-fab .ico{width:26px;height:26px}
.hero-actions .icon-btn.lg{width:34px;height:34px}
.hero-actions .icon-btn.lg .ico{width:30px;height:30px}

/* ---------- sections & cards ---------- */
.section{padding:8px 24px 4px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:14px 0 12px}
.section-title{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:0}
.section-title.small{font-size:16px}
.link-btn{color:var(--text-dim);font-size:13px;font-weight:700}
.link-btn:hover{color:#fff;text-decoration:underline}
.row-scroll{display:flex;gap:16px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x proximity}
.card{
  width:172px;flex:none;padding:12px;border-radius:8px;background:var(--panel-2);
  transition:background .2s;cursor:pointer;position:relative;scroll-snap-align:start;
}
.card:hover{background:var(--elev)}
.card-art{
  width:100%;aspect-ratio:1;border-radius:6px;overflow:hidden;margin-bottom:12px;position:relative;
  background:linear-gradient(135deg,#3c3c3c,#181818);display:grid;place-items:center;color:#9b9b9b;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
}
.card-art img{width:100%;height:100%;object-fit:cover;display:block}
.card-art.liked{background:linear-gradient(135deg,#450af5,#c4efd9);color:#fff}
.card-art .ico{width:44px;height:44px;opacity:.6}
.card-play{
  position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;
  background:var(--green);color:#000;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.5);
  opacity:0;transform:translateY(8px);transition:.18s;
}
.card:hover .card-play{opacity:1;transform:none}
.card-play:hover{background:var(--green-hi);transform:scale(1.05)!important}
.card-name{font-weight:700;font-size:14.5px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-sub{font-size:12.5px;color:var(--text-mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}

/* ---------- track table ---------- */
.tracklist{padding:0 16px}
.tl-head,.tl-row{
  display:grid;grid-template-columns:28px minmax(180px,4fr) minmax(120px,3fr) 96px 84px 40px;
  gap:14px;align-items:center;padding:0 12px;
}
.tl-head{
  height:36px;color:var(--text-mute);font-size:12px;letter-spacing:.03em;
  border-bottom:1px solid var(--border);margin-bottom:8px;position:sticky;top:0;
  background:var(--panel);z-index:2;
}
.tl-head .sortable{cursor:pointer;display:flex;align-items:center;gap:5px}
.tl-head .sortable:hover{color:#fff}
.tl-head .sortable.active{color:var(--green)}
.tl-row{
  height:56px;border-radius:6px;color:var(--text-dim);cursor:default;
  transition:background .1s;
}
.tl-row:hover{background:rgba(255,255,255,.075)}
.tl-row.playing{color:var(--green)}
.tl-row.playing .t-name{color:var(--green)}
.tl-num{font-size:14px;color:var(--text-mute);text-align:right;font-variant-numeric:tabular-nums;position:relative}
.tl-row:hover .tl-num span.num{display:none}
.tl-num .play-mini{display:none;width:100%;height:100%;place-items:center;color:#fff}
.tl-row:hover .tl-num .play-mini{display:grid}
.tl-num .eq{display:none;gap:2px;align-items:flex-end;height:14px;justify-content:center}
.tl-row.playing .tl-num .eq{display:flex}
.tl-row.playing .tl-num span.num{display:none}
.tl-row.playing:hover .tl-num .eq{display:none}
.eq i{width:2px;background:var(--green);animation:eq .9s linear infinite}
.eq i:nth-child(2){animation-delay:.25s}
.eq i:nth-child(3){animation-delay:.5s}
.eq i:nth-child(4){animation-delay:.15s}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.t-main{display:flex;align-items:center;gap:12px;min-width:0}
.t-art{
  width:40px;height:40px;border-radius:4px;flex:none;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(135deg,#333,#191919);color:#8d8d8d;
}
.t-art img{width:100%;height:100%;object-fit:cover}
.t-art .ico{width:18px;height:18px}
.t-text{min-width:0}
.t-name{color:#fff;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-artist{font-size:12.5px;color:var(--text-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-artist a:hover,.t-album:hover{text-decoration:underline;color:#fff}
.t-album,.t-date,.t-time{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-mute);font-variant-numeric:tabular-nums}
.t-actions{display:flex;align-items:center;gap:2px;justify-content:flex-end;opacity:0}
.tl-row:hover .t-actions,.tl-row.playing .t-actions{opacity:1}
.t-actions .like-on{color:var(--green);opacity:1}
.icon-btn{
  width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:var(--text-dim);
  transition:color .12s,transform .12s;
}
.icon-btn:hover{color:#fff}
.icon-btn:active{transform:scale(.92)}
.icon-btn .ico{width:18px;height:18px}
.icon-btn.on{color:var(--green)}
.icon-btn.on::after{
  content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--green);
}
.icon-btn{position:relative}
.icon-btn.muted .ico{opacity:.55}

/* ---------- search view ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 24px 8px}
.chip{
  background:var(--panel-3);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;color:#fff;
  transition:background .15s;
}
.chip:hover{background:var(--elev-hi)}
.chip.active{background:#fff;color:#000}
.genre-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;padding:8px 24px 20px}
.genre{
  aspect-ratio:1.9;border-radius:10px;padding:14px;font-weight:800;font-size:19px;letter-spacing:-.3px;
  position:relative;overflow:hidden;text-align:left;color:#fff;
}
.genre::after{
  content:"";position:absolute;right:-16px;bottom:-22px;width:78px;height:78px;border-radius:8px;
  background:rgba(0,0,0,.28);transform:rotate(25deg);box-shadow:0 6px 12px rgba(0,0,0,.35);
}
.genre:hover{filter:brightness(1.12)}

/* ---------- empty states ---------- */
.empty{
  margin:8px 24px 24px;padding:36px 24px;border-radius:12px;text-align:center;
  border:1px dashed rgba(255,255,255,.14);background:rgba(255,255,255,.025);
}
.empty .ico{width:46px;height:46px;color:#5c5c5c;margin:0 auto 14px}
.empty h3{margin:0 0 6px;font-size:18px}
.empty p{margin:0 0 18px;color:var(--text-mute);font-size:13.5px}
.empty-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- upload progress ---------- */
.upload-bar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--player-h) + 22px);
  background:var(--elev);border:1px solid var(--border);border-radius:10px;padding:12px 16px;
  display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);z-index:60;min-width:320px;
}
.upload-bar .spin{
  width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--green);
  border-radius:50%;animation:spin .8s linear infinite;flex:none;
}
@keyframes spin{to{transform:rotate(360deg)}}
.upload-bar .ub-text{font-size:13px;flex:1}
.upload-bar .ub-text small{display:block;color:var(--text-mute);font-size:11.5px}

/* ============================================================
   PLAYER BAR
   ============================================================ */
.player{
  grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:minmax(180px,1fr) minmax(340px,2fr) minmax(160px,1fr);
  align-items:center;gap:16px;padding:0 14px;background:var(--bg);
  border-top:1px solid rgba(255,255,255,.06);
}
.player-left{display:flex;align-items:center;gap:12px;min-width:0}
.np-cover{
  width:56px;height:56px;border-radius:5px;flex:none;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(135deg,#333,#161616);color:#8a8a8a;
}
.np-cover img{width:100%;height:100%;object-fit:cover}
.np-cover .ico{width:22px;height:22px}
.np-meta{min-width:0;flex:1}
.np-title{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-artist{font-size:11.5px;color:var(--text-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-artist:hover{color:#fff;text-decoration:underline;cursor:pointer}
.like-btn .ico{width:17px;height:17px}
.like-btn.liked{color:var(--green)}

.player-center{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;width:100%}
.controls{display:flex;align-items:center;gap:14px}
.play-btn{
  width:34px;height:34px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;
  transition:transform .12s;
}
.play-btn:hover{transform:scale(1.07)}
.play-btn:active{transform:scale(.95)}
.play-btn .ico{width:16px;height:16px}
.progress-row{display:flex;align-items:center;gap:10px;width:100%;max-width:620px}
.time{font-size:11px;color:var(--text-mute);font-variant-numeric:tabular-nums;min-width:34px;text-align:center}
.progress{position:relative;flex:1;height:16px;display:flex;align-items:center}
.progress-track{position:absolute;inset:7px 0;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.progress-fill{height:100%;width:0%;background:#fff;border-radius:3px}
.progress-knob{
  position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;left:0;margin-left:-6px;
  opacity:0;transition:opacity .12s;pointer-events:none;
}
.progress:hover .progress-fill{background:var(--green)}
.progress:hover .progress-knob,.progress.dragging .progress-knob{opacity:1}
.progress-input{
  position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;
  -webkit-appearance:none;appearance:none;background:none;
}
.player-right{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.volume-input{
  -webkit-appearance:none;appearance:none;width:96px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);
  outline:none;cursor:pointer;
}
.volume-input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px transparent}
.volume-input:hover::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.volume-input::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}

/* ============================================================
   QUEUE DRAWER
   ============================================================ */
.drawer{
  position:fixed;right:8px;top:8px;bottom:calc(var(--player-h) + 8px);width:340px;z-index:70;
  background:var(--panel);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;
  box-shadow:var(--shadow);transform:translateX(0);animation:slideIn .2s ease;
}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.drawer[hidden]{display:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 8px 18px}
.drawer-context{font-size:12px;color:var(--text-mute);padding:0 18px 8px;border-bottom:1px solid var(--border)}
.drawer-list{overflow-y:auto;padding:8px}
.q-item{display:flex;align-items:center;gap:10px;padding:6px;border-radius:6px}
.q-item:hover{background:rgba(255,255,255,.07)}
.q-item.playing .q-name{color:var(--green)}
.q-art{width:38px;height:38px;border-radius:4px;overflow:hidden;flex:none;background:linear-gradient(135deg,#333,#191919);display:grid;place-items:center;color:#8d8d8d}
.q-art img{width:100%;height:100%;object-fit:cover}
.q-text{min-width:0;flex:1}
.q-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-artist{font-size:11.5px;color:var(--text-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:65}

/* ============================================================
   DROPZONE / TOASTS / MENU / MODAL
   ============================================================ */
.dropzone{
  position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);
  display:none;place-items:center;
}
.dropzone.show{display:grid}
.dropzone-inner{
  border:2px dashed var(--green);border-radius:16px;padding:56px 64px;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:12px;background:rgba(30,215,96,.06);
}
.dropzone-inner .ico{width:52px;height:52px;color:var(--green)}
.dropzone-inner strong{font-size:20px}
.dropzone-inner span{color:var(--text-dim);font-size:13px;letter-spacing:.06em}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--player-h) + 18px);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:#2b2b2b;border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:8px;
  padding:11px 18px;font-size:13px;font-weight:600;box-shadow:var(--shadow);animation:toastIn .18s ease;
  display:flex;align-items:center;gap:10px;max-width:min(520px,90vw);
}
.toast .ico{width:17px;height:17px;color:var(--green);flex:none}
.toast.err .ico{color:#ff6b6b}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.context-menu{
  position:fixed;z-index:130;min-width:224px;max-height:70vh;overflow-y:auto;
  background:var(--elev);border:1px solid var(--border);border-radius:8px;padding:4px;
  box-shadow:0 12px 32px rgba(0,0,0,.6);animation:toastIn .12s ease;
}
.context-menu[hidden]{display:none}
.menu-item{
  display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:4px;
  font-size:13.5px;text-align:left;color:#eee;
}
.menu-item:hover{background:rgba(255,255,255,.1)}
.menu-item .ico{width:16px;height:16px;color:var(--text-dim)}
.menu-item.danger{color:#ff8080}
.menu-item.danger .ico{color:#ff8080}
.menu-sep{height:1px;background:var(--border);margin:4px 6px}
.menu-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-mute);padding:8px 12px 4px}

.modal-root:empty{display:none}
.modal-back{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:grid;place-items:center;
  animation:toastIn .15s ease;padding:20px;
}
.modal{
  background:var(--elev);border-radius:12px;width:min(420px,100%);padding:24px;box-shadow:var(--shadow);
  border:1px solid var(--border);
}
.modal h3{margin:0 0 6px;font-size:20px}
.modal p.sub{margin:0 0 18px;color:var(--text-mute);font-size:13px}
.modal input[type=text]{
  width:100%;background:#121212;border:1px solid rgba(255,255,255,.2);border-radius:6px;
  color:#fff;padding:12px;font-size:14px;outline:none;margin-bottom:16px;
}
.modal input[type=text]:focus{border-color:var(--green)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px}
.modal .btn-secondary{font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:24px;color:var(--text-dim)}
.modal .btn-secondary:hover{color:#fff}
.pick-list{max-height:46vh;overflow-y:auto;margin:0 -6px 16px}
.pick-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:6px;text-align:left}
.pick-item:hover{background:rgba(255,255,255,.08)}
.pick-item .lib-art{width:38px;height:38px}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 1100px){
  :root{--sidebar-w:240px}
  .tl-head,.tl-row{grid-template-columns:28px minmax(140px,4fr) minmax(100px,2.5fr) 80px 40px}
  .tl-head .t-date,.tl-row .t-date{display:none}
  .hero-art{width:150px;height:150px}
}
@media (max-width: 860px){
  :root{--sidebar-w:0px;--player-h:104px}
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{
    position:fixed;left:8px;top:8px;bottom:calc(var(--player-h) + 8px);width:280px;z-index:80;
    background:var(--bg);transform:translateX(-105%);transition:transform .22s ease;
  }
  .sidebar.open{transform:none}
  .main{grid-column:1}
  .topbar{padding:10px 12px}
  .topbar .round-btn:first-child{display:none}
  .user-name{display:none}
  .player{grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:0 8px;padding:8px 12px}
  .player-center{grid-column:1/-1;grid-row:1}
  .player-left{grid-column:1;grid-row:2}
  .player-right{grid-column:2;grid-row:2}
  .volume-input{display:none}
  .hero{flex-direction:column;align-items:flex-start;gap:14px;padding:12px 16px 18px}
  .hero-art{width:120px;height:120px}
  .hero-title{font-size:30px;letter-spacing:-1px}
  .section,.chips{padding-left:16px;padding-right:16px}
  .tracklist{padding:0 8px}
  .tl-head,.tl-row{grid-template-columns:24px minmax(120px,1fr) 60px 34px;gap:8px}
  .tl-head .t-album,.tl-row .t-album,.tl-head .t-date,.tl-row .t-date{display:none}
  .drawer{width:min(340px,calc(100vw - 16px))}
  .toasts{bottom:calc(var(--player-h) + 12px)}
  .upload-bar{bottom:calc(var(--player-h) + 14px);min-width:0;width:calc(100vw - 32px)}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ============================================================
   Дополнительные блоки
   ============================================================ */
.hamburger{display:none}
@media (max-width: 860px){ .hamburger{display:grid} }

/* быстрые плитки на главной */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.tile{
  display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;
  background:rgba(255,255,255,.09);border-radius:6px;height:64px;text-align:left;
  transition:background .18s;
}
.tile:hover{background:rgba(255,255,255,.16)}
.tile-art{width:64px;height:64px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,#3a3a3a,#1b1b1b);color:#9a9a9a}
.tile-art.liked{background:linear-gradient(135deg,#450af5,#c4efd9);color:#fff}
.tile-art img{width:100%;height:100%;object-fit:cover}
.tile-name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:52px}
.tile-play{
  position:absolute;right:10px;width:40px;height:40px;border-radius:50%;background:var(--green);color:#000;
  display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.45);opacity:0;transform:translateY(6px);transition:.18s;
}
.tile:hover .tile-play{opacity:1;transform:none}
.tile-play .ico{width:17px;height:17px}

/* тулбар списка */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 10px;flex-wrap:wrap}
.toolbar-search{
  display:flex;align-items:center;gap:8px;background:var(--panel-3);border-radius:6px;padding:0 10px;
  color:var(--text-mute);flex:1;max-width:340px;
}
.toolbar-search .ico{width:16px;height:16px}
.toolbar-search input{flex:1;min-width:0;background:none;border:0;outline:none;color:#fff;font-size:13px;padding:9px 0}

/* карточка исполнителя — круглая обложка */
.artist-art{border-radius:50%!important}

/* свойства файла в модалке */
.info-grid{display:grid;grid-template-columns:120px 1fr;gap:8px 14px;font-size:13px;margin:4px 0 20px}
.info-grid span{color:var(--text-mute)}
.info-grid b{font-weight:600;word-break:break-word}

/* карточка «создать плейлист» */
.create-card{background:var(--panel-3)}
.create-card:hover{background:var(--elev-hi)}
.create-art{background:rgba(255,255,255,.08)!important;color:#cfcfcf}
.create-art .ico{width:36px!important;height:36px!important;opacity:1!important}

/* предупреждение о режиме без сохранения */
.memnotice{
  background:#3a3105;color:#ffd166;font-size:12.5px;padding:9px 20px;line-height:1.5;
  border-bottom:1px solid rgba(255,209,102,.25);flex:none;
}
.memnotice b{color:#ffe8a3}

</style>
</head>
<body>

<div class="app" id="app">

  <!-- ================= SIDEBAR ================= -->

    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">

    <nav class="nav">
      <a href="#/home" class="nav-item" data-nav="home"><svg class="ico"><use href="#i-home"/></svg>Главная</a>

    </nav>

    <section class="library">
      <header class="library-head">
        <button class="library-title" data-action="route-library" title="Перейти в библиотеку">
          <svg class="ico"><use href="#i-library"/></svg>Моя библиотека
        </button>
        <div class="library-tools">
          <button class="icon-btn" data-action="new-playlist" title="Создать плейлист"><svg class="ico"><use href="#i-plus"/></svg></button>

        </div>
      </header>

      <div class="library-filter">
        <svg class="ico"><use href="#i-search"/></svg>
        <input id="libraryFilter" type="search" placeholder="Фильтр в библиотеке" autocomplete="off" spellcheck="false">
      </div>

      <div class="library-list" id="libraryList"></div>

      <div class="library-foot">
        <button class="foot-btn" data-action="upload"><svg class="ico"><use href="#i-upload"/></svg>Добавить музыку</button>
        <div class="storage" id="storageInfo"></div>
      </div>
    </section>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="main" id="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="round-btn hamburger" data-action="toggle-sidebar" title="Библиотека"><svg class="ico"><use href="#i-library"/></svg></button>
        <button class="round-btn" data-action="history-back" title="Назад"><svg class="ico"><use href="#i-back"/></svg></button>
        <button class="round-btn" data-action="history-forward" title="Вперёд"><svg class="ico"><use href="#i-fwd"/></svg></button>
        <div class="top-search">
          <svg class="ico"><use href="#i-search"/></svg>
          <input id="globalSearch" type="search" placeholder="Что послушаем? Исполнитель, трек, альбом…" autocomplete="off" spellcheck="false">
          <button class="top-search-clear" data-action="clear-search" hidden title="Очистить"><svg class="ico"><use href="#i-close"/></svg></button>
        </div>
      </div>
      <div class="topbar-right">
        <button class="btn-green" data-action="upload"><svg class="ico"><use href="#i-upload"/></svg>Загрузить</button>
        <div class="user-chip" title="Локальный профиль">
          <span class="user-avatar">SC</span>
          <span class="user-name">Локальный</span>
        </div>
      </div>
    </header>

    <div class="content" id="content" tabindex="-1"></div>
  </main>

  <!-- ================= PLAYER BAR ================= -->
  <footer class="player" id="player">
    <div class="player-left">
      <div class="np-cover" id="npCover"><svg class="ico"><use href="#i-note"/></svg></div>
      <div class="np-meta">
        <div class="np-title" id="npTitle">Ничего не играет</div>
        <div class="np-artist" id="npArtist">Загрузите музыку, чтобы начать</div>
      </div>
      <button class="icon-btn like-btn" data-action="like-current" title="В любимые"><svg class="ico"><use href="#i-heart"/></svg></button>
    </div>

<script>
/* ===== js/tags.js ===== */
/* ============================================================
   tags.js — чтение метаданных из аудиофайлов средствами браузера.
   Поддерживается: ID3v2.2/2.3/2.4 + ID3v1 (MP3),
   MP4/M4A atom "ilst" (M4A, AAC в контейнере MP4, ALAC),
   FLAC (VORBIS_COMMENT + PICTURE + STREAMINFO).
   Всё, что не распознано, аккуратно заполняется по имени файла.
   ============================================================ */
(function (global) {
  'use strict';

  /* ---------- декодеры строк (с запасным вариантом без TextDecoder) ---------- */
  function fallbackDecode(bytes, label) {
    var s = '', i;
    if (label === 'utf-16le') {
      for (i = 0; i + 1 < bytes.length; i += 2) s += String.fromCharCode(bytes[i] | (bytes[i + 1] << 8));
      return s;
    }
    if (label === 'utf-16be') {
      for (i = 0; i + 1 < bytes.length; i += 2) s += String.fromCharCode((bytes[i] << 8) | bytes[i + 1]);
      return s;
    }
    if (label === 'utf-8') {
      for (i = 0; i < bytes.length;) {
        var c = bytes[i++];
        if (c < 0x80) s += String.fromCharCode(c);
        else if (c >= 0xc0 && c < 0xe0) { s += String.fromCharCode(((c & 0x1f) << 6) | (bytes[i++] & 0x3f)); }
        else if (c >= 0xe0 && c < 0xf0) { s += String.fromCharCode(((c & 0x0f) << 12) | ((bytes[i++] & 0x3f) << 6) | (bytes[i++] & 0x3f)); }
        else if (c >= 0xf0) {
          var cp = ((c & 0x07) << 18) | ((bytes[i++] & 0x3f) << 12) | ((bytes[i++] & 0x3f) << 6) | (bytes[i++] & 0x3f);
          cp -= 0x10000;
          s += String.fromCharCode(0xd800 + (cp >> 10), 0xdc00 + (cp & 0x3ff));
        } else { i++; }
      }
      return s;
    }
    for (i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return s;
  }

  var textDecoderCache = {};
  function decoder(label) {
    if (!textDecoderCache[label]) {
      var td = null;
      if (typeof TextDecoder !== 'undefined') {
        try { td = new TextDecoder(label); } catch (e) { td = null; }
        if (!td) { try { td = new TextDecoder('utf-8'); } catch (e2) { td = null; } }
      }
      textDecoderCache[label] = td || { decode: function (bytes) { return fallbackDecode(bytes, label); } };
    }
    return textDecoderCache[label];
  }

  function u16be(b, o) { return (b[o] << 8) | b[o + 1]; }
  function u32be(b, o) { return ((b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3]) >>> 0; }
  function u32le(b, o) { return (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0; }
  function syncsafe(b, o) {
    return ((b[o] & 0x7f) << 21) | ((b[o + 1] & 0x7f) << 14) | ((b[o + 2] & 0x7f) << 7) | (b[o + 3] & 0x7f);
  }
  function ascii(b, off, len) {
    var s = '';
    for (var i = 0; i < len && off + i < b.length; i++) s += String.fromCharCode(b[off + i]);
    return s;
  }

  /* ---------- декодирование строк ID3 ---------- */
  function decodeId3Text(view, encoding) {
    // view: Uint8Array без байта кодировки
    var label;
    if (encoding === 1) {
      // UTF-16 c BOM
      if (view[0] === 0xff && view[1] === 0xfe) { label = 'utf-16le'; view = view.subarray(2); }
      else if (view[0] === 0xfe && view[1] === 0xff) { label = 'utf-16be'; view = view.subarray(2); }
      else label = 'utf-16le';
    } else if (encoding === 2) { label = 'utf-16be'; }
    else if (encoding === 3) { label = 'utf-8'; }
    else { label = 'windows-1252'; }

    var str = decoder(label).decode(view);
    return str;
  }

  function cleanText(str) {
    if (!str) return '';
    // убираем нули и переводы, склеиваем множественные значения
    return str
      .split(/\u0000+/)
      .map(function (s) { return s.replace(/\uFFFD/g, '').trim(); })
      .filter(Boolean)
      .join(', ')
      .trim();
  }

  function findTerminator(b, start, end, twoByte) {
    var i = start;
    if (twoByte) {
      while (i + 1 < end) {
        if (b[i] === 0 && b[i + 1] === 0) return i;
        i += 2;
      }
      return end;
    }
    while (i < end) { if (b[i] === 0) return i; i++; }
    return end;
  }

  /* ============================================================
     ID3v2
     ============================================================ */
  function parseId3(bytes, out) {
    var ver = bytes[3];
    var flags = bytes[5];
    var size = syncsafe(bytes, 6);
    var off = 10;
    var end = Math.min(10 + size, bytes.length);

    // unsynchronisation на уровне тега
    if ((flags & 0x80) && ver < 4) {
      var cleaned = [];
      for (var k = 0; k < bytes.length; k++) {
        cleaned.push(bytes[k]);
        if (bytes[k] === 0xff && bytes[k + 1] === 0x00) k++;
      }
      bytes = new Uint8Array(cleaned);
    }
    if (flags & 0x40) { // extended header
      var extSize = ver === 4 ? syncsafe(bytes, 10) : u32be(bytes, 10);
      off += ver === 4 ? extSize : extSize + 4;
    }

    if (ver === 2) {
      while (off + 6 <= end) {
        var id22 = ascii(bytes, off, 3);
        if (!/^[A-Z0-9]{3}$/.test(id22)) break;
        var len22 = (bytes[off + 3] << 16) | (bytes[off + 4] << 8) | bytes[off + 5];
        var s22 = off + 6, e22 = Math.min(s22 + len22, end);
        applyId3Frame(id22, bytes, s22, e22, out);
        off = e22;
      }
      return;
    }

    while (off + 10 <= end) {
      var id = ascii(bytes, off, 4);
      if (!/^[A-Z0-9]{4}$/.test(id)) break;
      var fsize = ver === 4 ? syncsafe(bytes, off + 4) : u32be(bytes, off + 4);
      var s = off + 10, e = Math.min(s + fsize, end);
      applyId3Frame(id, bytes, s, e, out);
      off = e;
      if (fsize <= 0) break;
    }
  }

  function applyId3Frame(id, b, s, e, out) {
    if (s >= e) return;
    switch (id) {
      case 'TIT2': case 'TT2': out.title = out.title || frameText(b, s, e); break;
      case 'TPE1': case 'TP1': out.artist = out.artist || frameText(b, s, e); break;
      case 'TPE2': case 'TP2': out.albumArtist = out.albumArtist || frameText(b, s, e); break;
      case 'TALB': case 'TAL': out.album = out.album || frameText(b, s, e); break;
      case 'TYER': case 'TYE': case 'TDRC': out.year = out.year || frameText(b, s, e).slice(0, 10); break;
      case 'TCON': case 'TCO': out.genre = out.genre || frameText(b, s, e); break;
      case 'TRCK': out.trackNo = out.trackNo || frameText(b, s, e); break;
      case 'APIC': case 'PIC': out.cover = out.cover || frameApic(b, s, e); break;
      default: break;
    }
  }

  function frameText(b, s, e) {
    var enc = b[s];
    var text = decodeId3Text(b.subarray(s + 1, e), enc);
    return cleanText(text);
  }

  function frameApic(b, s, e) {
    try {
      var enc = b[s];
      var p = s + 1;
      var mimeEnd = p;
      while (mimeEnd < e && b[mimeEnd] !== 0) mimeEnd++;
      var mime = ascii(b, p, mimeEnd - p) || 'image/jpeg';
      if (/^[A-Za-z0-9]{3}$/.test(mime)) { // ID3v2.2: 3-символьный код картинки (JPG/PNG)
        mime = mime.toUpperCase() === 'PNG' ? 'image/png' : 'image/jpeg';
      }
      p = mimeEnd + 1;
      p += 1; // picture type
      var twoByte = enc === 1 || enc === 2;
      var descEnd = findTerminator(b, p, e, twoByte);
      p = descEnd + (twoByte ? 2 : 1);
      if (p >= e) return null;
      var data = b.subarray(p, e);
      if (!data.length) return null;
      return new Blob([data], { type: mime });
    } catch (err) { return null; }
  }

  /* ---------- ID3v1 ---------- */
  function parseId3v1(bytes, out) {
    if (bytes.length < 128) return;
    var o = bytes.length - 128;
    if (ascii(bytes, o, 3) !== 'TAG') return;
    function fld(start, len) {
      var raw = bytes.subarray(o + start, o + start + len);
      var txt = decoder('windows-1252').decode(raw).replace(/\u0000.*$/, '').trim();
      return txt;
    }
    out.title = out.title || fld(3, 30);
    out.artist = out.artist || fld(33, 30);
    out.album = out.album || fld(63, 30);
    out.year = out.year || fld(93, 4) || null;
    var genreIdx = bytes[o + 127];
    if (!out.genre && typeof genreIdx === 'number') out.genre = null;
  }

  /* ============================================================
     MP4 / M4A / ALAC
     ============================================================ */
  function parseMp4(bytes, out) {
    var off = 0;
    var guard = 0;
    while (off + 8 <= bytes.length && guard++ < 512) {
      var size = u32be(bytes, off);
      var type = ascii(bytes, off + 4, 4);
      var headerSize = 8;
      if (size === 1 && off + 16 <= bytes.length) {
        var hi = u32be(bytes, off + 8), lo = u32be(bytes, off + 12);
        size = hi * 4294967296 + lo;
        headerSize = 16;
      }
      if (size <= 0 || size > bytes.length - off) size = bytes.length - off;
      if (type === 'moov') {
        walkMp4(bytes, off + headerSize, off + size, out, 0);
        return;
      }
      off += size;
    }
  }

  function walkMp4(b, start, end, out, depth) {
    if (depth > 6) return;
    var off = start;
    var guard = 0;
    while (off + 8 <= end && guard++ < 2048) {
      var size = u32be(b, off);
      var type = ascii(b, off + 4, 4);
      if (size < 8 || off + size > end + 8) return;
      var bodyStart = off + 8;
      var bodyEnd = Math.min(off + size, end);
      if (type === 'udta') walkMp4(b, bodyStart, bodyEnd, out, depth + 1);
      else if (type === 'meta') walkMp4(b, bodyStart + 4, bodyEnd, out, depth + 1); // version+flags
      else if (type === 'ilst') { parseIlst(b, bodyStart, bodyEnd, out); return; }
      off += size;
    }
  }

  function parseIlst(b, start, end, out) {
    var off = start;
    var guard = 0;
    while (off + 8 <= end && guard++ < 512) {
      var size = u32be(b, off);
      var name = ascii(b, off + 4, 4);
      if (size < 8) break;
      var itemEnd = Math.min(off + size, end);
      var p = off + 8;
      while (p + 8 <= itemEnd) {
        var dsize = u32be(b, p);
        var dname = ascii(b, p + 4, 4);
        if (dsize < 8) break;
        if (dname === 'data' && p + 16 <= itemEnd) {
          var dataType = u32be(b, p + 8) & 0xffffff;
          var payload = b.subarray(p + 16, Math.min(p + dsize, itemEnd));
          applyIlst(name, dataType, payload, out);
        }
        p += dsize;
      }
      off += size;
    }
  }

  function applyIlst(name, dataType, payload, out) {
    var str = function () { return cleanText(decoder('utf-8').decode(payload)); };
    switch (name) {
      case '\u00a9nam': out.title = out.title || str(); break;
      case '\u00a9ART': out.artist = out.artist || str(); break;
      case 'aART': out.albumArtist = out.albumArtist || str(); break;
      case '\u00a9alb': out.album = out.album || str(); break;
      case '\u00a9day': out.year = out.year || str().slice(0, 10); break;
      case '\u00a9gen': out.genre = out.genre || str(); break;
      case 'trkn':
        if (payload.length >= 4) out.trackNo = String((payload[2] << 8) | payload[3]);
        break;
      case 'covr':
        if (!out.cover && payload.length > 8) {
          var mime = dataType === 14 ? 'image/png' : (dataType === 13 ? 'image/jpeg' : guessImageMime(payload));
          out.cover = new Blob([payload], { type: mime });
        }
        break;
      default: break;
    }
  }

  function guessImageMime(bytes) {
    if (bytes[0] === 0x89 && bytes[1] === 0x50) return 'image/png';
    if (bytes[0] === 0x47 && bytes[1] === 0x49) return 'image/gif';
    if (bytes[8] === 0x57 && bytes[9] === 0x45) return 'image/webp';
    return 'image/jpeg';
  }

  /* ============================================================
     FLAC
     ============================================================ */
  function parseFlac(bytes, out) {
    var off = 4;
    var last = false;
    var guard = 0;
    while (!last && off + 4 <= bytes.length && guard++ < 128) {
      var header = bytes[off];
      last = !!(header & 0x80);
      var type = header & 0x7f;
      var len = (bytes[off + 1] << 16) | (bytes[off + 2] << 8) | bytes[off + 3];
      var s = off + 4;
      var e = Math.min(s + len, bytes.length);
      if (type === 0) parseStreamInfo(bytes, s, e, out);
      else if (type === 4) parseVorbisComments(bytes, s, e, out);
      else if (type === 6) parseFlacPicture(bytes, s, e, out);
      off = e;
    }
  }

  function parseStreamInfo(b, s, e, out) {
    if (s + 18 > e) return;
    var p = s + 10; // min/max block size + frame sizes
    var b0 = b[p], b1 = b[p + 1], b2 = b[p + 2], b3 = b[p + 3];
    var sampleRate = (b0 << 12) | (b1 << 4) | (b2 >> 4);
    // total samples: последние 36 бит из 8 байт
    var totalSamples = ((b3 & 0x0f) * 4294967296) +
      (b[p + 4] * 16777216) + (b[p + 5] * 65536) + (b[p + 6] * 256) + b[p + 7];
    if (sampleRate > 0 && totalSamples > 0) out.duration = (totalSamples / sampleRate) * 1000;
  }

  function parseVorbisComments(b, s, e, out) {
    try {
      var p = s;
      var vendorLen = u32le(b, p); p += 4 + vendorLen;
      var count = u32le(b, p); p += 4;
      for (var i = 0; i < count && p + 4 <= e; i++) {
        var len = u32le(b, p); p += 4;
        var raw = b.subarray(p, Math.min(p + len, e));
        p += len;
        var line = decoder('utf-8').decode(raw);
        var eq = line.indexOf('=');
        if (eq < 0) continue;
        var key = line.slice(0, eq).toUpperCase();
        var val = cleanText(line.slice(eq + 1));
        if (!val) continue;
        if (key === 'TITLE' && !out.title) out.title = val;
        else if ((key === 'ARTIST' || key === 'PERFORMER') && !out.artist) out.artist = val;
        else if (key === 'ALBUM' && !out.album) out.album = val;
        else if (key === 'ALBUMARTIST' && !out.albumArtist) out.albumArtist = val;
        else if (key === 'DATE' && !out.year) out.year = val.slice(0, 10);
        else if (key === 'GENRE' && !out.genre) out.genre = val;
        else if (key === 'TRACKNUMBER' && !out.trackNo) out.trackNo = val;
      }
    } catch (err) { /* ignore malformed */ }
  }

  function parseFlacPicture(b, s, e, out) {
    try {
      var p = s + 4; // picture type
      var mimeLen = u32be(b, p); p += 4;
      var mime = ascii(b, p, mimeLen); p += mimeLen;
      var descLen = u32be(b, p); p += 4 + descLen;
      p += 16; // width, height, depth, colors
      var dataLen = u32be(b, p); p += 4;
      var data = b.subarray(p, Math.min(p + dataLen, e));
      if (data.length && !out.cover) {
        out.cover = new Blob([data], { type: mime || guessImageMime(data) });
      }
    } catch (err) { /* ignore */ }
  }

  /* ============================================================
     OGG (Vorbis / Opus) — базовая поддержка комментариев
     ============================================================ */
  function parseOgg(bytes, out) {
    try {
      var vorbis = findSeq(bytes, [0x03, 0x76, 0x6f, 0x72, 0x62, 0x69, 0x73], 0); // "\x03vorbis"
      var opus = findSeq(bytes, [0x4f, 0x70, 0x75, 0x73, 0x54, 0x61, 0x67, 0x73], 0); // "OpusTags"
      var start = -1, skip = 0;
      if (vorbis >= 0 && (opus < 0 || vorbis < opus)) { start = vorbis; skip = 7; }
      else if (opus >= 0) { start = opus; skip = 8; }
      if (start < 0) return;
      parseVorbisComments(bytes, start + skip, bytes.length, out);
    } catch (err) { /* ignore */ }
  }

  function findSeq(b, seq, from) {
    outer:
    for (var i = from; i < b.length - seq.length; i++) {
      for (var j = 0; j < seq.length; j++) {
        if (b[i + j] !== seq[j]) continue outer;
      }
      return i;
    }
    return -1;
  }

  /* ============================================================
     Публичный API
     ============================================================ */
  function guessMime(fileName, fallbackType) {
    var ext = (fileName.split('.').pop() || '').toLowerCase();
    var map = {
      mp3: 'audio/mpeg', mp2: 'audio/mpeg', m4a: 'audio/mp4', m4b: 'audio/mp4',
      mp4: 'audio/mp4', alac: 'audio/mp4', aac: 'audio/aac', flac: 'audio/flac',
      wav: 'audio/wav', wave: 'audio/wav', ogg: 'audio/ogg', oga: 'audio/ogg',
      opus: 'audio/ogg', webm: 'audio/webm', aiff: 'audio/aiff', aif: 'audio/aiff',
      aifc: 'audio/aiff', m4r: 'audio/mp4', wma: 'audio/x-ms-wma', ape: 'audio/ape'
    };
    return map[ext] || fallbackType || 'audio/mpeg';
  }

  function prettyTitle(fileName) {
    return fileName
      .replace(/\.[^.]+$/, '')
      .replace(/[_]+/g, ' ')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }

  /**
   * Разбирает метаданные из ArrayBuffer.
   * @returns {{title,artist,album,albumArtist,year,genre,cover,duration,mime}}
   */
  function parse(buffer, fileName, mimeHint) {
    var bytes = new Uint8Array(buffer);
    var out = { title: '', artist: '', album: '', albumArtist: '', year: '', genre: '', cover: null, duration: 0, mime: guessMime(fileName, mimeHint) };

    try {
      var isFlac = bytes[0] === 0x66 && bytes[1] === 0x4c && bytes[2] === 0x61 && bytes[3] === 0x43; // fLaC
      var isId3 = bytes[0] === 0x49 && bytes[1] === 0x44 && bytes[2] === 0x33;
      var isMp4 = ascii(bytes, 4, 4) === 'ftyp';
      var isOgg = ascii(bytes, 0, 4) === 'OggS';
      var isRiff = ascii(bytes, 0, 4) === 'RIFF';

      if (isFlac) parseFlac(bytes, out);
      if (isId3) parseId3(bytes, out);
      if (isMp4) parseMp4(bytes, out);
      if (isOgg) parseOgg(bytes, out);
      if (isRiff) parseId3(bytes, out); // на случай нестандартных WAV с ID3-чанком

      if (!out.title || !out.artist) parseId3v1(bytes, out);
    } catch (err) {
      console.warn('[tags] не удалось разобрать метаданные:', err);
    }

    if (!out.title) out.title = prettyTitle(fileName);
    if (!out.artist) out.artist = 'Неизвестный исполнитель';
    if (!out.album) out.album = 'Сингл';
    if (!out.year) out.year = '';
    return out;
  }

  global.Tags = { parse: parse, guessMime: guessMime, prettyTitle: prettyTitle };
})(window);

</script>
<script>
/* ===== js/db.js ===== */
/* ============================================================
   db.js — хранилище библиотеки в IndexedDB.
   Аудиофайлы и обложки лежат как Blob'ы прямо в браузере,
   поэтому ничего не нужно отправлять на сервер.

   Если IndexedDB недоступен (приватный режим, песочница iframe,
   file:// в некоторых браузерах) — приложение продолжает работать
   в режиме «только память»: всё играет, но не сохраняется
   между перезагрузками.
   ============================================================ */
(function (global) {
  'use strict';

  var DB_NAME = 'spotclone';
  var DB_VERSION = 1;
  var STORE_TRACKS = 'tracks';
  var STORE_PLAYLISTS = 'playlists';
  var STORE_META = 'meta';

  var dbPromise = null;
  var memoryMode = false;

  /* ---------- запасное хранилище в памяти ---------- */
  var mem = {
    tracks: new Map(),
    playlists: new Map(),
    meta: new Map()
  };
  var MEM_STORES = { tracks: mem.tracks, playlists: mem.playlists, meta: mem.meta };

  function memoryApi(storeName) {
    var map = MEM_STORES[storeName];
    return {
      getAll: function () { return Promise.resolve(Array.from(map.values())); },
      put: function (rec) { map.set(rec.id !== undefined ? rec.id : rec.key, rec); return Promise.resolve(); },
      del: function (key) { map.delete(key); return Promise.resolve(); },
      get: function (key) { return Promise.resolve(map.get(key)); },
      clear: function () { map.clear(); return Promise.resolve(); }
    };
  }

  function open() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve) {
      if (!global.indexedDB) { memoryMode = true; resolve(null); return; }
      var req;
      try {
        req = indexedDB.open(DB_NAME, DB_VERSION);
      } catch (e) {
        memoryMode = true; resolve(null); return;
      }
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(STORE_TRACKS)) {
          var s = db.createObjectStore(STORE_TRACKS, { keyPath: 'id' });
          s.createIndex('addedAt', 'addedAt');
          s.createIndex('title', 'title');
        }
        if (!db.objectStoreNames.contains(STORE_PLAYLISTS)) {
          db.createObjectStore(STORE_PLAYLISTS, { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains(STORE_META)) {
          db.createObjectStore(STORE_META, { keyPath: 'key' });
        }
      };
      req.onsuccess = function () {
        var db = req.result;
        db.onversionchange = function () { db.close(); dbPromise = null; };
        resolve(db);
      };
      req.onerror = function () { memoryMode = true; resolve(null); };
      req.onblocked = function () { memoryMode = true; resolve(null); };
      // некоторые окружения молча не отдают ни success, ни error
      setTimeout(function () {
        if (!memoryMode && req.readyState === 'done' && !req.result) { memoryMode = true; resolve(null); }
      }, 3000);
    });
    return dbPromise;
  }

  function run(storeName, mode, fn) {
    return open().then(function (db) {
      if (!db) { // режим памяти
        var api = memoryApi(storeName);
        return fn(api);
      }
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(storeName, mode);
        var store = tx.objectStore(storeName);
        var result;
        try { result = fn(store); } catch (err) { reject(err); return; }
        tx.oncomplete = function () {
          resolve(result && result.__req ? result.__req.result : result);
        };
        tx.onerror = function () { reject(tx.error); };
        tx.onabort = function () { reject(tx.error || new Error('Транзакция отменена')); };
      });
    });
  }

  // адаптер «как objectStore», чтобы один и тот же код работал и с памятью
  function wrap(req) { return { __req: req }; }

  var DB = {
    init: function () { return open().then(function () { return { memory: memoryMode }; }); },
    isMemory: function () { return memoryMode; },

    /* ---------- треки ---------- */
    getAllTracks: function () {
      return run(STORE_TRACKS, 'readonly', function (s) {
        return memoryMode ? s.getAll() : wrap(s.getAll());
      });
    },
    putTrack: function (track) {
      return run(STORE_TRACKS, 'readwrite', function (s) {
        return memoryMode ? s.put(track) : s.put(track);
      });
    },
    putTracks: function (tracks) {
      return run(STORE_TRACKS, 'readwrite', function (s) {
        tracks.forEach(function (t) { s.put(t); });
      });
    },
    deleteTrack: function (id) {
      return run(STORE_TRACKS, 'readwrite', function (s) {
        return memoryMode ? s.del(id) : s.delete(id);
      });
    },

    /* ---------- плейлисты ---------- */
    getAllPlaylists: function () {
      return run(STORE_PLAYLISTS, 'readonly', function (s) {
        return memoryMode ? s.getAll() : wrap(s.getAll());
      });
    },
    putPlaylist: function (pl) {
      return run(STORE_PLAYLISTS, 'readwrite', function (s) { s.put(pl); });
    },
    deletePlaylist: function (id) {
      return run(STORE_PLAYLISTS, 'readwrite', function (s) {
        return memoryMode ? s.del(id) : s.delete(id);
      });
    },

    /* ---------- настройки ---------- */
    getMeta: function (key, fallback) {
      return run(STORE_META, 'readonly', function (s) {
        return memoryMode ? s.get(key) : wrap(s.get(key));
      }).then(function (rec) {
        if (rec && typeof rec === 'object' && 'value' in rec) return rec.value;
        return fallback;
      }).catch(function () { return fallback; });
    },
    setMeta: function (key, value) {
      return run(STORE_META, 'readwrite', function (s) { s.put({ key: key, value: value }); });
    },

    /* ---------- обслуживание ---------- */
    clearAll: function () {
      return open().then(function (db) {
        if (!db) {
          mem.tracks.clear(); mem.playlists.clear(); mem.meta.clear();
          return;
        }
        return new Promise(function (resolve, reject) {
          var names = [STORE_TRACKS, STORE_PLAYLISTS, STORE_META];
          var tx = db.transaction(names, 'readwrite');
          names.forEach(function (n) { tx.objectStore(n).clear(); });
          tx.oncomplete = function () { resolve(); };
          tx.onerror = function () { reject(tx.error); };
        });
      });
    }
  };

  /* ============================================================
     Кэш object URL'ов (создаются лениво)
     ============================================================ */
  var urlCache = new Map(); // key -> url

  function objectUrl(key, blob) {
    if (!blob) return null;
    var cached = urlCache.get(key);
    if (cached) return cached;
    var url = URL.createObjectURL(blob);
    urlCache.set(key, url);
    return url;
  }

  var Files = {
    audioUrl: function (track) { return track ? objectUrl('a:' + track.id, track.audioBlob) : null; },
    coverUrl: function (track) { return track && track.coverBlob ? objectUrl('c:' + track.id, track.coverBlob) : null; },
    coverUrlFromBlob: function (blob, key) { return blob ? objectUrl('c:' + key, blob) : null; },
    release: function (trackId) {
      ['a:' + trackId, 'c:' + trackId].forEach(function (k) {
        var u = urlCache.get(k);
        if (u) { URL.revokeObjectURL(u); urlCache.delete(k); }
      });
    },
    releaseAll: function () {
      urlCache.forEach(function (u) { URL.revokeObjectURL(u); });
      urlCache.clear();
    }
  };

  global.DB = DB;
  global.Files = Files;
})(window);

</script>
<script>
/* ===== js/player.js ===== */
/* ============================================================
   player.js — движок воспроизведения (HTMLAudioElement).
   Очередь, перемешивание, повтор, громкость, события.
   ============================================================ */
(function (global) {
  'use strict';

  var audio = new Audio();
  audio.preload = 'metadata';

  var state = {
    queue: [],          // массив треков в исходном порядке
    order: [],          // порядок проигрывания (индексы в queue)
    pos: -1,            // позиция внутри order
    playing: false,
    shuffle: false,
    repeat: 'off',      // 'off' | 'all' | 'one'
    volume: 0.8,
    muted: false,
    context: '',        // откуда запущена очередь (название плейлиста)
    duration: 0
  };

  var listeners = [];
  function emit(type) {
    for (var i = 0; i < listeners.length; i++) {
      try { listeners[i](type, state); } catch (e) { console.error(e); }
    }
  }

  function current() {
    return state.pos >= 0 && state.pos < state.order.length
      ? state.queue[state.order[state.pos]]
      : null;
  }

  /* ---------- построение порядка ---------- */
  function buildOrder(startIndex) {
    var idxs = state.queue.map(function (_, i) { return i; });
    if (state.shuffle) {
      var rest = idxs.filter(function (i) { return i !== startIndex; });
      for (var i = rest.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = rest[i]; rest[i] = rest[j]; rest[j] = t;
      }
      state.order = startIndex >= 0 ? [startIndex].concat(rest) : rest;
      state.pos = startIndex >= 0 ? 0 : -1;
    } else {
      state.order = idxs;
      state.pos = startIndex >= 0 ? startIndex : -1;
    }
  }

  /* ---------- загрузка трека ---------- */
  function load(track, autoplay) {
    if (!track) { audio.removeAttribute('src'); audio.load(); state.duration = 0; emit('track'); return; }
    var url = global.Files.audioUrl(track);
    if (!url) return;
    audio.src = url;
    audio.load();
    state.duration = track.duration || 0;
    emit('track');
    if (autoplay !== false) play();
  }

  function play() {
    var p = audio.play();
    if (p && p.catch) {
      p.catch(function (err) {
        if (err && err.name === 'NotAllowedError') {
          state.playing = false;
          emit('play');
          emit('blocked');
        } else if (err && err.name === 'AbortError') {
          /* перебито новым src — нормально */
        } else {
          state.playing = false;
          emit('play');
          emit('error');
        }
      });
    }
  }

  function pause() {
    audio.pause();
  }

  var Player = {
    audio: audio,
    state: state,
    on: function (fn) { listeners.push(fn); return function () { listeners = listeners.filter(function (l) { return l !== fn; }); }; },
    emit: emit,

    current: current,
    currentIndexInQueue: function () {
      return current() ? state.queue.indexOf(current()) : -1;
    },

    /** Задать очередь и начать играть с позиции startIndex (индекс в массиве tracks). */
    setQueue: function (tracks, startIndex, contextName) {
      state.queue = tracks.slice();
      state.context = contextName || '';
      if (!tracks.length) {
        state.order = []; state.pos = -1;
        audio.pause(); audio.removeAttribute('src'); audio.load();
        state.playing = false; state.duration = 0;
        emit('queue'); emit('track'); emit('play');
        return;
      }
      var start = typeof startIndex === 'number' && startIndex >= 0 ? startIndex : 0;
      buildOrder(start);
      load(current());
      emit('queue');
    },

    /** Добавить треки в конец очереди. */
    enqueue: function (tracks) {
      var self = this;
      var added = [];
      tracks.forEach(function (t) {
        if (state.queue.indexOf(t) === -1) { state.queue.push(t); }
        state.order.push(state.queue.indexOf(t));
        added.push(t);
      });
      emit('queue');
      if (state.pos < 0) { state.pos = 0; load(current()); }
      return added;
    },

    /** Проиграть конкретный трек, при необходимости — вместе с очередью. */
    playTrack: function (track, tracks, contextName) {
      if (tracks && tracks.length && tracks.indexOf(track) >= 0) {
        this.setQueue(tracks, tracks.indexOf(track), contextName);
      } else {
        this.setQueue([track], 0, contextName || '');
      }
    },

    toggle: function () {
      if (!current()) return;
      if (audio.paused) play(); else pause();
    },

    next: function (userInitiated) {
      if (!state.order.length) return;
      if (state.repeat === 'one' && !userInitiated) { audio.currentTime = 0; play(); return; }
      if (state.pos < state.order.length - 1) {
        state.pos++;
        load(current());
      } else if (state.repeat === 'all') {
        buildOrder(-1);
        if (state.shuffle) { /* уже перемешано */ }
        state.pos = 0;
        load(current());
      } else {
        audio.pause();
        audio.currentTime = 0;
        state.playing = false;
        emit('play');
      }
      emit('queue');
    },

    prev: function () {
      if (!state.order.length) return;
      // если трек играет дольше 3 секунд — начинаем его заново (как в Spotify)
      if (audio.currentTime > 3) { audio.currentTime = 0; return; }
      if (state.pos > 0) {
        state.pos--;
      } else if (state.repeat === 'all') {
        state.pos = state.order.length - 1;
      } else {
        audio.currentTime = 0;
        return;
      }
      load(current());
      emit('queue');
    },

    jumpTo: function (queueIndex) {
      var p = state.order.indexOf(queueIndex);
      if (p >= 0) { state.pos = p; load(current()); emit('queue'); return; }
      // трек есть в очереди, но не в порядке проигрывания — ставим в конец
      if (queueIndex < 0 || queueIndex >= state.queue.length) return;
      state.order.push(queueIndex);
      state.pos = state.order.length - 1;
      load(current());
      emit('queue');
    },

    /** Убрать трек из очереди (например, при удалении из библиотеки). */
    removeFromQueue: function (track) {
      var qi = state.queue.indexOf(track);
      if (qi < 0) return;
      var wasCurrent = current() === track;
      state.queue.splice(qi, 1);
      state.order = state.order
        .filter(function (i) { return i !== qi; })
        .map(function (i) { return i > qi ? i - 1 : i; });
      if (wasCurrent) {
        if (state.pos >= state.order.length) state.pos = state.order.length - 1;
        if (state.pos >= 0 && state.order.length) load(current());
        else { state.pos = -1; audio.pause(); audio.removeAttribute('src'); audio.load(); state.playing = false; }
      } else if (state.pos >= 0) {
        state.pos = state.order.indexOf(state.queue.indexOf(current()));
      }
      emit('queue');
    },

    seek: function (seconds) {
      if (!isFinite(audio.duration) || audio.duration <= 0) return;
      audio.currentTime = Math.max(0, Math.min(audio.duration - 0.05, seconds));
      emit('time');
    },

    seekPercent: function (p) {
      if (!isFinite(audio.duration) || audio.duration <= 0) return;
      this.seek(audio.duration * p);
    },

    setVolume: function (v, silent) {
      state.volume = Math.max(0, Math.min(1, v));
      audio.volume = state.muted ? 0 : state.volume;
      if (!silent) emit('volume');
    },

    toggleMute: function () {
      state.muted = !state.muted;
      audio.volume = state.muted ? 0 : state.volume;
      emit('volume');
    },

    toggleShuffle: function () {
      state.shuffle = !state.shuffle;
      var curTrack = current();
      if (state.shuffle) {
        var startIdx = curTrack ? state.queue.indexOf(curTrack) : -1;
        buildOrder(startIdx);
      } else {
        var keep = curTrack;
        buildOrder(-1);
        if (keep) { state.pos = state.queue.indexOf(keep); }
      }
      emit('shuffle');
      emit('queue');
    },

    cycleRepeat: function () {
      state.repeat = state.repeat === 'off' ? 'all' : (state.repeat === 'all' ? 'one' : 'off');
      emit('repeat');
    },

    setRepeat: function (mode) {
      state.repeat = mode;
      emit('repeat');
    },

    stop: function () {
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
      state.queue = []; state.order = []; state.pos = -1;
      state.playing = false; state.duration = 0;
      emit('queue'); emit('track'); emit('play');
    }
  };

  /* ---------- события audio ---------- */
  audio.addEventListener('play', function () { state.playing = true; emit('play'); });
  audio.addEventListener('pause', function () { state.playing = false; emit('play'); });
  audio.addEventListener('timeupdate', function () { emit('time'); });
  audio.addEventListener('durationchange', function () {
    if (isFinite(audio.duration) && audio.duration > 0) state.duration = audio.duration * 1000;
    emit('time');
  });
  audio.addEventListener('loadedmetadata', function () {
    if (isFinite(audio.duration) && audio.duration > 0) state.duration = audio.duration * 1000;
    emit('time');
  });
  audio.addEventListener('ended', function () { Player.next(false); });
  audio.addEventListener('error', function () {
    state.playing = false;
    emit('play');
    emit('error');
  });

  Player.setVolume(0.8, true);
  global.Player = Player;
})(window);

</script>
<script>
/* ===== js/app.js ===== */
/* ============================================================
   app.js — интерфейс SpotClone: библиотека, плейлисты, поиск,
   загрузка файлов, роутинг, горячие клавиши.
   ============================================================ */
(function () {
  'use strict';

  /* ============================ helpers ============================ */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function fmtTime(ms) {
    if (!ms || ms < 0 || !isFinite(ms)) return '0:00';
    const total = Math.round(ms / 1000);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
      : `${m}:${String(s).padStart(2, '0')}`;
  }

    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;

    return mb >= 1024 ? (mb / 1024).toFixed(1) + ' ГБ' : (mb < 1 ? (n / 1024).toFixed(0) + ' КБ' : mb.toFixed(1) + ' МБ');
  }

  const ICON = (name, cls) => `<svg class="ico ${cls || ''}"><use href="#i-${name}"/></svg>`;

  /* ============================ state ============================ */

  const state = {
    tracks: [],
    playlists: [],
    recent: [],
    filter: '',
    search: '',
    sortKey: 'addedAt',
    sortDir: 'desc',
    route: { name: 'home', id: null },

  };

    el.libraryList = $('#libraryList');
    el.libraryFilter = $('#libraryFilter');
    el.globalSearch = $('#globalSearch');
    el.storageInfo = $('#storageInfo');
    el.main = $('#main');

    bindEvents();

    try {
      await DB.init();
      await loadState();
    } catch (err) {

    if (DB.isMemory && DB.isMemory()) showMemoryNotice();

    Player.setVolume(state.volume, true);

    Player.setRepeat(state.repeat || 'off');

    route();

    const bar = document.createElement('div');
    bar.className = 'memnotice';

    el.main.insertBefore(bar, el.content);
    el.storageInfo.textContent = 'Хранилище недоступно — данные только в памяти';
  }

  function showFatal(err) {
    console.error(err);
    el.content.innerHTML = `
      <div class="view"><div class="empty" style="margin-top:60px">
        ${ICON('note')}
        <h3>Не удалось инициализировать хранилище</h3>
        <p>${esc(err.message || err)}</p>
        <p style="font-size:12.5px">Подсказка: откройте сайт по адресу <b>http://</b> или <b>https://</b> (GitHub Pages, локальный сервер), а не двойным щелчком по файлу.</p>
      </div></div>`;
  }

  async function loadState() {

      DB.getAllTracks(),
      DB.getAllPlaylists(),
      Promise.all([
        DB.getMeta('volume', 0.8),
        DB.getMeta('recent', []),
        DB.getMeta('repeat', 'off'),
        DB.getMeta('shuffle', false)
      ])
    ]);

  const playlistById = (id) => state.playlists.find((p) => p.id === id);
  const isLiked = (id) => liked().trackIds.includes(id);

  const likedTracks = () => liked().trackIds.map(trackById).filter(Boolean);
  const playlistTracks = (pl) => (pl ? pl.trackIds.map(trackById).filter(Boolean) : []);

  /* ============================ sorting / filtering ============================ */

    const k = state.sortKey, dir = state.sortDir === 'asc' ? 1 : -1;
    const arr = list.slice();
    arr.sort((a, b) => {
      let va, vb;
      switch (k) {
        case 'title': va = norm(a.title); vb = norm(b.title); break;
        case 'artist': va = norm(a.artist); vb = norm(b.artist); break;
        case 'album': va = norm(a.album); vb = norm(b.album); break;
        case 'duration': va = a.duration || 0; vb = b.duration || 0; break;
        default: va = a.addedAt || 0; vb = b.addedAt || 0;
      }
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      // стабильность: по имени
      return norm(a.title).localeCompare(norm(b.title));
    });
    return arr;
  }

  function filterTracks(list, query) {
    const q = norm(query);
    if (!q) return list;
    const words = q.split(/\s+/).filter(Boolean);
    return list.filter((t) => {
      const hay = norm([t.title, t.artist, t.album, t.albumArtist, t.genre, t.fileName].join(' '));
      return words.every((w) => hay.includes(w));
    });
  }

  /* ============================ accents (цвет из обложки) ============================ */
  function accentFor(track) {
    const coverUrl = track ? Files.coverUrl(track) : null;
    if (!coverUrl) return Promise.resolve(null);
    if (state.accentCache.has(coverUrl)) return Promise.resolve(state.accentCache.get(coverUrl));
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        try {
          const c = document.createElement('canvas');
          c.width = 12; c.height = 12;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, 12, 12);
          const d = ctx.getImageData(0, 0, 12, 12).data;
          let r = 0, g = 0, b = 0, n = 0;
          for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
          r = Math.round(r / n); g = Math.round(g / n); b = Math.round(b / n);
          // чуть поднимаем яркость, чтобы градиент читался
          const boost = (v) => Math.round(clamp(v * 1.1 + 18, 0, 255));
          const rgb = [boost(r), boost(g), boost(b)];
          const val = rgb.join(',');
          state.accentCache.set(coverUrl, val);
          resolve(val);
        } catch (e) { resolve(null); }
      };
      img.onerror = () => resolve(null);
      img.src = coverUrl;
    });
  }

  function applyAccent(rgb) {
    const view = $('.view', el.content);
    if (!view) return;
    if (!rgb) { view.style.background = ''; return; }
    view.style.background = `linear-gradient(180deg, rgba(${rgb},.55) 0px, rgba(${rgb},.18) 240px, rgba(18,18,18,0) 520px)`;
  }

  /* ============================ artwork html ============================ */
  function artHtml(track, cls) {
    const url = track ? Files.coverUrl(track) : null;

  async function updateStorageInfo() {
    let used = 0;
    state.tracks.forEach((t) => { used += (t.size || 0); });
    let quotaTxt = '';
    try {
      if (navigator.storage && navigator.storage.estimate) {
        const est = await navigator.storage.estimate();
        if (est.quota) quotaTxt = ` · лимит ${fmtBytes(est.quota)}`;
      }
    } catch (e) { /* ignore */ }
    el.storageInfo.textContent = `Библиотека: ${state.tracks.length} ${plural(state.tracks.length, 'трек', 'трека', 'треков')} · ${fmtBytes(used)}${quotaTxt}`;
  }

  /* ============================ routing ============================ */
  function route() {
    const hash = location.hash || '#/home';
    const parts = hash.replace(/^#\/?/, '').split('/');
    const name = parts[0] || 'home';
    state.route = { name, id: parts[1] || null };

    $$('.nav-item').forEach((a) => {
      const target = a.getAttribute('href').replace(/^#\//, '');
      a.classList.toggle('active', target === name || (name === 'library' && target === 'library'));
    });

    if (name === 'search') {
      if (document.activeElement !== el.globalSearch) { /* keep typing */ }
    }

    renderSidebar();
    renderView();
    el.content.scrollTop = 0;
    closeSidebarMobile();
  }

  function go(hash) {
    if (location.hash === hash) route();
    else location.hash = hash;
  }

  /* ============================ views ============================ */
  function renderView() {
    const r = state.route;
    if (r.name === 'search') return renderSearchView();
    if (r.name === 'library') return renderLibraryView();
    if (r.name === 'liked') return renderLikedView();
    if (r.name === 'playlist') return renderPlaylistView(r.id);
    if (r.name === 'album' && r.id) return renderCollectionView('album', decodeURIComponent(r.id));
    if (r.name === 'artist' && r.id) return renderCollectionView('artist', decodeURIComponent(r.id));
    return renderHomeView();
  }

        <div class="genre-grid">`;
      if (genres.length) {
        const colors = ['#dc148c', '#1e3264', '#8d67ab', '#e8115b', '#148a08', '#e13300', '#503750', '#0d72ea', '#ba5d07', '#7774d3', '#b02897', '#af2896'];
        html += genres.map((g, i) => `<button class="genre" style="background:${colors[i % colors.length]}" data-action="genre" data-genre="${esc(g)}">${esc(g)}</button>`).join('');
      } else {
        html += `<div class="empty" style="grid-column:1/-1">
          ${ICON('search')}
          <h3>Жанров пока нет</h3>
          <p>Загрузите треки с тегами (ID3 / Vorbis / MP4) — и здесь появятся плитки жанров.</p>
          <div class="empty-actions"><button class="btn-green" data-action="upload">${ICON('upload')}Загрузить музыку</button></div>
        </div>`;
      }
      html += `</div></div>`;
      el.content.innerHTML = html;
      state.currentList = [];
      applyAccent(null);
      return;
    }

    const matched = sortedTracks(filterTracks(state.tracks, q));
    const albums = new Map();
    matched.forEach((t) => {
      const key = t.album || 'Сингл';
      if (!albums.has(key)) albums.set(key, []);
      albums.get(key).push(t);
    });
    const artists = new Map();
    matched.forEach((t) => {
      const key = t.artist || 'Неизвестный исполнитель';
      if (!artists.has(key)) artists.set(key, 0);
      artists.set(key, artists.get(key) + 1);
    });

    state.currentList = matched;
    state.currentContext = { key: 'search', title: 'Поиск: ' + q };

    let html = `<div class="view">
      <div class="section" style="padding-top:18px">
        <div class="section-head"><h2 class="section-title">Результаты по запросу «${esc(q)}»</h2>
        <span style="color:var(--text-mute);font-size:13px">${matched.length} ${plural(matched.length, 'трек', 'трека', 'треков')}</span></div>`;

    if (artists.size) {
      html += `<div class="section-head" style="margin:20px 0 10px"><h3 class="section-title small">Исполнители</h3></div>
      <div class="row-scroll">${Array.from(artists.entries()).slice(0, 8).map(([name, count]) => {
        const t = matched.find((x) => (x.artist || 'Неизвестный исполнитель') === name);
        return cardHtml({
          route: '#/artist/' + encodeURIComponent(name),
          title: name,
          sub: `Исполнитель • ${count} ${plural(count, 'трек', 'трека', 'треков')}`,
          art: artHtml(t, 'card-art').replace('card-art', 'card-art artist-art'),
          playCtx: 'artist:' + encodeURIComponent(name)
        });
      }).join('')}</div>`;
    }

    if (albums.size) {
      html += `<div class="section-head" style="margin:20px 0 10px"><h3 class="section-title small">Альбомы</h3></div>
      <div class="row-scroll">${Array.from(albums.entries()).slice(0, 10).map(([name, list]) => cardHtml({
        route: '#/album/' + encodeURIComponent(name),
        title: name,
        sub: `${esc(list[0].artist)} • ${list.length} ${plural(list.length, 'трек', 'трека', 'треков')}`,
        art: artHtml(list[0], 'card-art'),
        playCtx: 'album:' + encodeURIComponent(name)
      })).join('')}</div>`;
    }

    html += `<div class="section-head" style="margin:20px 0 10px"><h3 class="section-title small">Треки</h3></div>
      ${trackTable(matched.slice(0, 50), { title: 'Поиск: ' + q })}
      </div></div>`;
    el.content.innerHTML = html;
    applyAccent(null);
  }

  function collectGenres() {
    const set = new Map();
    state.tracks.forEach((t) => {
      const g = (t.genre || '').trim();
      if (!g) return;
      // ID3 иногда хранит "(17)Rock" или числа
      const clean = g.replace(/^\(\d+\)/, '').replace(/^\d+$/, '').trim();
      if (!clean || clean.length > 22) return;
      const key = clean.toLowerCase();
      set.set(key, set.get(key) || clean);
    });
    return Array.from(set.values()).slice(0, 12);
  }
